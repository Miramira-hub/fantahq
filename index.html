<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FantaHQ — Centro decisioni Fantacalcio</title>
<style>
  :root{
    --bg:#F4F7F4; --surface:#FFFFFF; --surface2:#EDF2ED; --ink:#16211A; --muted:#5C6E62;
    --border:#D9E2DA; --accent:#1E7A52; --accent-ink:#FFFFFF; --accent-soft:#DFEEE6;
    --gold:#9A6B1F; --gold-bg:#F6EBD4; --danger:#BE4040; --danger-bg:#F7E2E2;
    --ok:#1E7A52; --warn:#9A6B1F; --info:#2D7DD2; --info-bg:#E3EDF9;
    --rP:#D97E0B; --rD:#2E9E5B; --rC:#2D7DD2; --rA:#D64550;
    --shadow:0 1px 3px rgba(22,33,26,.08);
    --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
    --sans:-apple-system,"Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E1411; --surface:#17211B; --surface2:#1E2A22; --ink:#E6EEE8; --muted:#94A79A;
      --border:#2A382F; --accent:#3FBE83; --accent-ink:#0B1510; --accent-soft:#1D3529;
      --gold:#D9A441; --gold-bg:#33290F; --danger:#E0655F; --danger-bg:#3A1D1B;
      --ok:#3FBE83; --warn:#D9A441; --info:#4A90DE; --info-bg:#16283C;
      --rP:#C97E14; --rD:#35A566; --rC:#4A90DE; --rA:#E05A64;
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1411; --surface:#17211B; --surface2:#1E2A22; --ink:#E6EEE8; --muted:#94A79A;
    --border:#2A382F; --accent:#3FBE83; --accent-ink:#0B1510; --accent-soft:#1D3529;
    --gold:#D9A441; --gold-bg:#33290F; --danger:#E0655F; --danger-bg:#3A1D1B;
    --ok:#3FBE83; --warn:#D9A441; --info:#4A90DE; --info-bg:#16283C;
    --rP:#C97E14; --rD:#35A566; --rC:#4A90DE; --rA:#E05A64;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --bg:#F4F7F4; --surface:#FFFFFF; --surface2:#EDF2ED; --ink:#16211A; --muted:#5C6E62;
    --border:#D9E2DA; --accent:#1E7A52; --accent-ink:#FFFFFF; --accent-soft:#DFEEE6;
    --gold:#9A6B1F; --gold-bg:#F6EBD4; --danger:#BE4040; --danger-bg:#F7E2E2;
    --ok:#1E7A52; --warn:#9A6B1F; --info:#2D7DD2; --info-bg:#E3EDF9;
    --rP:#D97E0B; --rD:#2E9E5B; --rC:#2D7DD2; --rA:#D64550;
    --shadow:0 1px 3px rgba(22,33,26,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 8px}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  header.app{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
  .hrow{max-width:1140px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:8px}
  .brand b{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .brand span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  .league{display:flex;align-items:center;gap:4px}
  .league select{max-width:170px;font-weight:700;padding:5px 8px}
  .hstats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .hstat{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:4px 10px;text-align:right;min-width:86px}
  .hstat .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .hstat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
  .hstat .v.gold{color:var(--gold)}
  nav.tabs{max-width:1140px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:8px 12px 9px;color:var(--muted);font-weight:600;white-space:nowrap}
  nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

  main{max-width:1140px;margin:0 auto;padding:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:16px;font-weight:800;letter-spacing:-.01em}
  .card .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}

  .banner{border:1px solid var(--gold);background:var(--gold-bg);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13.5px}
  .banner b{color:var(--gold)}

  .role{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;color:#fff;font-size:12px;font-weight:800;flex:none}
  .role.P{background:var(--rP)} .role.D{background:var(--rD)} .role.C{background:var(--rC)} .role.A{background:var(--rA)}
  .badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
  .badge.f1{border-color:var(--gold);color:var(--gold)}
  .badge.f2{border-color:var(--accent);color:var(--accent)}
  .badge.mine{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .badge.gone{background:var(--surface2);color:var(--muted);text-decoration:line-through}
  .star{background:none;border:none;font-size:17px;color:var(--border);padding:2px 4px}
  .star.on{color:var(--gold)}

  /* badge consiglio */
  .adv{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
  .adv.must{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold)}
  .adv.target{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
  .adv.bet{background:var(--info-bg);color:var(--info);border:1px solid var(--info)}
  .adv.safe{background:var(--surface2);color:var(--ink);border:1px solid var(--border)}
  .adv.watch{background:var(--gold-bg);color:var(--warn);border:1px dashed var(--warn)}
  .adv.avoid{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger)}
  .adv.filler{background:none;color:var(--muted);border:1px solid var(--border)}
  .adv.nd{background:none;color:var(--muted);border:1px dashed var(--border)}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar input[type=search]{flex:1;min-width:160px}
  .fchip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:600;color:var(--muted)}
  .fchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .twrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface2)}
  td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  td .team{color:var(--muted);font-size:12px}
  td input[type=number]{width:60px;padding:3px 6px}
  .r{text-align:right}
  .pname{cursor:pointer}
  .pname:hover b{color:var(--accent)}

  tr.detail>td{background:var(--surface2);white-space:normal;padding:12px 14px}
  tr.flash>td{animation:rowflash 1.6s ease-out 1}
  @keyframes rowflash{0%,45%{background:var(--gold-bg)}}
  @media (prefers-reduced-motion:reduce){tr.flash>td{animation:none}}
  .dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}
  .dstat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
  .dstat .l{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .dstat .v{font-family:var(--mono);font-weight:700;font-size:15px}
  .why{font-size:13px;max-width:75ch}
  .why b{color:var(--accent)}

  .chipset{display:flex;gap:5px;flex-wrap:wrap}
  .kchip{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--surface);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
  .kchip.hot{border-color:var(--gold);color:var(--gold)}
  .kchip.bad{border-color:var(--danger);color:var(--danger)}
  .kchip.good{border-color:var(--accent);color:var(--accent)}

  .btn{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:6px 12px;font-weight:600}
  .btn:hover{background:var(--surface2)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.warn{border-color:var(--danger);color:var(--danger)}
  .btn.sm{padding:3px 9px;font-size:13px}

  .bar{display:grid;grid-template-columns:90px 1fr 110px;gap:10px;align-items:center;margin:7px 0}
  .bar .lab{font-weight:700;display:flex;gap:7px;align-items:center;font-size:13px}
  .bar .track{background:var(--surface2);border-radius:5px;height:14px;position:relative;overflow:hidden}
  .bar .fill{position:absolute;inset:0 auto 0 0;border-radius:5px}
  .bar .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;text-align:right;color:var(--muted)}

  .buybar{position:sticky;top:96px;z-index:10;background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
  .buybar .who{font-weight:800;font-size:16px}
  .buybar .hint{color:var(--muted);font-size:13px;width:100%}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:800}
  .kpi .s{font-size:11.5px;color:var(--muted)}
  .kpi.gold .v{color:var(--gold)}
  .kpi.danger .v{color:var(--danger)}
  .slot{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:8px;padding:4px 10px;font-family:var(--mono);font-weight:700}

  /* allerte reparti */
  .alert{display:flex;gap:10px;align-items:center;border-radius:9px;padding:8px 12px;margin:6px 0;border:1px solid var(--border);background:var(--surface)}
  .alert.warn{border-color:var(--warn);background:var(--gold-bg)}
  .alert.crit{border-color:var(--danger);background:var(--danger-bg)}
  .alert .txt{flex:1;min-width:0;font-size:13.5px}
  .alert .txt b{font-weight:800}
  .alert .pick{font-weight:700}

  /* movimenti (log asta) */
  .mov{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid var(--border);font-size:13.5px}
  .mov:last-child{border-bottom:none}
  .mov .who2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mov .pr{font-family:var(--mono);font-weight:700}
  .mov .tagmine{color:var(--accent);font-weight:800}
  .mov .taggone{color:var(--muted)}
  .mov button{border:none;background:none;color:var(--danger);font-weight:800;font-size:15px;cursor:pointer;padding:2px 6px}

  /* modalità asta rapida */
  .fastwrap{max-width:560px;margin:0 auto}
  .fastcard{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
  .fastcard .who{font-size:24px;font-weight:800;letter-spacing:-.01em}
  .fastcard .meta{color:var(--muted);font-size:14px;margin:2px 0 10px}
  .bigrow{display:flex;gap:8px;align-items:stretch;margin-top:10px;flex-wrap:wrap}
  .bigbtn{flex:1;min-width:120px;font-size:18px;font-weight:800;padding:16px 10px;border-radius:12px;border:2px solid var(--border);background:var(--surface)}
  .bigbtn.mine{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .bigbtn.gone{border-color:var(--gold);color:var(--gold)}
  .stepper{display:flex;align-items:center;gap:0;border:2px solid var(--accent);border-radius:12px;overflow:hidden}
  .stepper button{width:52px;font-size:26px;font-weight:800;background:var(--surface2);border:none;color:var(--ink)}
  .stepper input{width:90px;text-align:center;font-size:26px;font-weight:800;border:none;border-radius:0;font-family:var(--mono)}
  .switchbar{display:flex;justify-content:flex-end;margin-bottom:10px}

  /* card consigli */
  .pcard{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:10px 12px;margin-bottom:8px}
  .pcard .mid{flex:1;min-width:0}
  .pcard .nm{font-weight:800}
  .pcard .tm{color:var(--muted);font-size:12px}
  .pcard .note{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:normal}
  .pcard .fm{text-align:right;flex:none}
  .pcard .fm .big{font-family:var(--mono);font-weight:800;font-size:19px}
  .pcard .fm .sm{font-size:10.5px;color:var(--muted)}
  h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 8px}
  h3.sec .adv{margin-left:6px}

  .xi{display:flex;flex-direction:column;gap:4px}
  .xirow{display:flex;gap:8px;align-items:center;padding:5px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
  .xirow.tit{border-color:var(--accent);background:var(--accent-soft)}
  .xirow .nm{font-weight:700;flex:1}
  .xirow .sc{font-family:var(--mono);color:var(--muted)}

  details.g{border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:10px;overflow:hidden}
  details.g summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none;display:flex;align-items:center;gap:10px}
  details.g summary::before{content:"›";color:var(--accent);font-weight:800;font-size:18px;transition:transform .15s}
  details.g[open] summary::before{transform:rotate(90deg)}
  details.g .body{padding:0 16px 14px;max-width:68ch}
  details.g .body p{margin:8px 0}
  details.g .body li{margin:4px 0}
  details.g .body b{color:var(--accent)}
  @media (prefers-reduced-motion:reduce){details.g summary::before{transition:none}}

  textarea.paste{width:100%;min-height:120px;font-family:var(--mono);font-size:12.5px}
  .help{font-size:12.5px;color:var(--muted)}
  .help code{background:var(--surface2);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:11.5px}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90vw}
  #toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){#toast{transition:none}}
  .footactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
  .verdict{border-radius:10px;padding:12px 16px;font-weight:700;margin-top:12px;border:1px solid var(--border);background:var(--surface2)}
  .verdict.good{border-color:var(--ok);color:var(--ok);background:var(--accent-soft)}
  .verdict.bad{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}
</style>
</head>
<body>


<header class="app">
  <div class="hrow">
    <div class="brand"><b>FantaHQ</b><span>centro decisioni</span></div>
    <div class="league">
      <select id="leagueSel" title="Cambia lega"></select>
      <button id="newLeagueBtn" class="btn sm" title="Aggiungi una lega">＋</button>
    </div>
    <div class="hstats">
      <div class="hstat"><div class="l">Crediti</div><div class="v gold" id="hBudget">–</div></div>
      <div class="hstat"><div class="l">Slot liberi</div><div class="v" id="hSlots">–</div></div>
      <div class="hstat"><div class="l">Max offerta</div><div class="v" id="hMax">–</div></div>
    </div>
    <button id="themeBtn" class="btn sm" title="Tema chiaro/scuro">◐</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="view"></main>
<div id="toast" role="status"></div>

<script src="data/kb.js"></script>
<script>
"use strict";
const KEY = "fantahq_v3";
const OLD2 = "fantahq_v2";
const OLD1 = "fantahq_v1";
const DATA = window.FANTAHQ_DATA || {date:"dati non caricati (manca data/kb.js)", teams:{}, kb:[]};
const DATA_DATE = DATA.date;
const ROLES = ["P","D","C","A"];
const ROLE_NAMES = {P:"Portieri", D:"Difensori", C:"Centrocampisti", A:"Attaccanti"};
const ROLE_VAR = {P:"var(--rP)", D:"var(--rD)", C:"var(--rC)", A:"var(--rA)"};
const MODULES = {"3-4-3":{D:3,C:4,A:3},"3-5-2":{D:3,C:5,A:2},"4-3-3":{D:4,C:3,A:3},"4-4-2":{D:4,C:4,A:2},"4-5-1":{D:4,C:5,A:1},"5-3-2":{D:5,C:3,A:2},"5-4-1":{D:5,C:4,A:1}};
const PRESETS = {
  equilibrata:{P:8,D:15,C:25,A:52,label:"Equilibrata"},
  modificatore:{P:7,D:24,C:24,A:45,label:"Modificatore difesa"},
  attacco:{P:6,D:12,C:22,A:60,label:"Attacco pesante"}
};
const TABS = [["consigli","Consigli"],["listone","Listone"],["strategia","Strategia"],["asta","Asta live"],["rosa","Rosa"],["formazione","Formazione"],["confronto","Confronto"],["scambi","Scambi"],["guida","Guida"],["impostazioni","Impostazioni"]];

const TEAMS = DATA.teams;
/* ================= CALENDARIO E DIFFICOLTÀ DEL TURNO =================
   Il calendario ufficiale 2026-27, validato in fase di build. Da qui esce il pezzo che
   mancava del tutto: non "quanto è forte il mio giocatore", ma "quanto è forte
   l'avversario che incontra domenica".

   La difficoltà non è la stessa per tutti i ruoli. Un attaccante soffre una DIFESA
   forte; un difensore o un portiere soffrono un ATTACCO forte. Quindi si guarda il
   rating giusto dell'avversario, non la sua forza generica — e si aggiunge il fattore
   campo, che vale storicamente circa un terzo di livello. */
const CAL = DATA.calendario || null;
const CAMPO = 0.35;                       // vantaggio di giocare in casa, in "livelli"
function turnoDi(team, giornata){
  if(!CAL || !CAL.perSquadra[team]) return null;
  return CAL.perSquadra[team][giornata] || null;
}
/* difficoltà da 1 (turno facilissimo) a 5 (proibitivo), dal punto di vista del ruolo */
function difficoltaTurno(role, team, giornata){
  const t = turnoDi(team, giornata);
  if(!t) return null;
  const avv = TEAMS[t.avv];
  if(!avv) return null;
  const forzaContraria = (role === "A" || role === "C") ? avv.def : avv.atk;
  const d = forzaContraria + (t.casa ? -CAMPO : CAMPO);
  return { avv: t.avv, casa: t.casa, val: Math.max(1, Math.min(5, d)) };
}
const DIFF_LABEL = d => d==null ? "—" : d<=2.2 ? "molto facile" : d<=2.9 ? "facile" : d<=3.6 ? "media" : d<=4.3 ? "difficile" : "proibitiva";
const DIFF_COLOR = d => d==null ? "var(--muted)" : d<=2.2 ? "var(--ok)" : d<=2.9 ? "var(--accent)" : d<=3.6 ? "var(--muted)" : d<=4.3 ? "var(--warn)" : "var(--danger)";

const KB = DATA.kb;
/* ================= stato ================= */
let store = null;   // { v, current, order:[id], leagues:{ id:{name, state} } }
let state = null;   // scorciatoia = store.leagues[store.current].state
let ui = { tab:"consigli", search:"", role:"", team:"", tag:"", sort:"exp", onlyTarget:false, limit:200, openId:0,
           consRole:"", astaSearch:"", astaSel:null, tradeGive:[], tradeGet:[], tradeSearch:"", confirmReset:false,
           cmp:[], cmpSearch:"", fast:false, astaRole:"", astaSort:"qta", squadStrategy:null, confirmSample:false, astaPag:0,
           splitCalc:"", openTeam:"" };   // ripartizione calcolata + squadra aperta in Forza squadre
let undoStack = [];

const norm = s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g,"").trim();

const KBI = KB.map((r,i)=>({ i, r:r[0], n:r[1], t:r[2], qta:r[3], fm:r[4], est:r[5], pres:r[6], gol:r[7], ass:r[8],
  rig:r[9], tit:r[10], up:r[11], inj:r[12], age:r[13], unc:r[14], newT:r[15], note:r[16], extId:r[17]||"", fvm:+r[18]||0, xgd:+r[19]||0, fm2:+r[20]||0,
  /* stagione IN CORSO: presenze, gol, assist, fantamedia e media voto di quest'anno */
  pvOra:+r[21]||0, golOra:+r[22]||0, assOra:+r[23]||0, fmOra:+r[24]||0, mvOra:+r[25]||0 }));
/* quante giornate si sono giocate: il massimo delle presenze in giro */
const GIORNATE_GIOCATE = KBI.reduce((m,k)=>Math.max(m,k.pvOra||0), 0);   // KBI, non KB: KB e l array grezzo
const KBMAP = new Map(KBI.map(k=>[norm(k.n)+"|"+k.r, k]));

/* token significativi di un nome (scarta le iniziali tipo "N." / "V." / "Lo") */
const sigToks = name=>norm(name).split(" ").filter(w=>w.length>=3);
const KBSIG = KBI.map(k=>({k, toks:sigToks(k.n)}));
const KBCACHE = new Map();
/* Il listone ufficiale scrive "Cognome I." (es. "Paz N.") mentre il DB può avere
   "Nome Cognome" (es. "Nico Paz"): abbino per token di cognome condiviso + ruolo,
   disambiguando per squadra quando ci sono più candidati. */
function kbFor(p){
  const key = norm(p.name)+"|"+p.role+"|"+norm(p.team);
  if(KBCACHE.has(key)) return KBCACHE.get(key);
  let k = KBMAP.get(norm(p.name)+"|"+p.role) || null;
  if(!k){
    const qt = sigToks(p.name);
    const cands = KBSIG.filter(x=>x.k.r===p.role && x.toks.some(w=>qt.includes(w))).map(x=>x.k);
    if(cands.length===1) k = cands[0];
    else if(cands.length>1){
      const sameTeam = cands.filter(x=>norm(x.t)===norm(p.team));
      k = sameTeam.length===1 ? sameTeam[0] : null;
    }
  }
  KBCACHE.set(key, k);
  return k;
}

function mkPlayer(id,name,team,role,qta,fvm,kbi){
  return { id, name, team, role, qta:+qta||1, fvm:+fvm||0, kbi:(kbi??-1), extId:"", rating:0, target:false, maxBid:0, status:"free", paid:0, owner:null, note:"" };
}
function freshState(){
  /* Il database interno porta già le quotazioni ufficiali e i codici Id del listone:
     official=true evita l'avviso "quote stimate" e abilita l'export CSV senza import. */
  const players = KBI.map((k,ix)=>{ const p = mkPlayer(ix+1, k.n, k.t, k.r, k.qta, k.fvm||0, k.i); p.extId = k.extId||""; return p; });
  return { official: !!DATA.official, nextId:players.length+1,
    settings:{ budget:500, slots:{P:3,D:8,C:8,A:6}, split:{P:8,D:15,C:25,A:52}, rules:{modDef:"no"}, nTeams:8, deepBench:true },
    rivalMod:{},   // modulo imposto a mano a una squadra: { "me" | idRivale : "4-3-3" }
    players, teamsDiff:{}, avail:{}, managers:[], lineup:{ module:"3-4-3" }, giornata:1 };
}
function normState(st){                 // ripara uno state caricato da vecchi salvataggi
  st = st || freshState();
  st.settings = st.settings || freshState().settings;
  st.settings.rules = st.settings.rules || {modDef:"no"};
  st.settings.nTeams = st.settings.nTeams || 8;
  if(st.settings.deepBench === undefined) st.settings.deepBench = true;   // riserve vere, non riempitivi
  if(!st.rivalMod || typeof st.rivalMod !== "object") st.rivalMod = {};
  st.teamsDiff = st.teamsDiff || {}; st.avail = st.avail || {};
  st.giornata = Math.max(1, Math.min(38, +st.giornata || 1));
  st.managers = Array.isArray(st.managers) ? st.managers : [];
  st.lineup = st.lineup || { module:"3-4-3" };
  if(!Array.isArray(st.players)) st.players = freshState().players;
  st.players.forEach(p=>{ if(p.owner===undefined) p.owner=null; });
  /* Aggiornamento per chi ha dati salvati da prima che il database contenesse il listone
     ufficiale: aggancia i codici Id e toglie l'avviso "quote stimate", senza toccare rosa,
     voti e obiettivi. Non tocca chi ha importato un listone proprio. */
  if(DATA.official && !st.official){
    let hit = 0;
    st.players.forEach(p=>{ const k = kbFor(p); if(k && k.extId){ p.extId = p.extId || k.extId; if(k.qta) p.qta = k.qta; hit++; } });
    if(hit >= st.players.length * 0.8) st.official = true;
  }
  st.nextId = st.nextId || (Math.max(0,...st.players.map(p=>p.id||0))+1);
  return st;
}
/* rivali (avversari): id + nome. Il numero di squadre totali sta in settings.nTeams. */
function ensureManagers(){
  const want = Math.max(0, (state.settings.nTeams||8) - 1);
  const m = state.managers;
  while(m.length < want) m.push({ id:"m"+(m.length+1)+"_"+Math.random().toString(36).slice(2,6), name:"Rivale "+(m.length+1) });
  if(m.length > want) state.managers = m.slice(0, want);
}
function managerName(id){ if(!id) return "altri"; const m=state.managers.find(x=>x.id===id); return m?m.name:"altri"; }
function rivalStats(){
  ensureManagers();
  const tot = ROLES.reduce((s,r)=>s+state.settings.slots[r],0);
  return state.managers.map(m=>{
    const owned = state.players.filter(p=>p.status==="gone" && p.owner===m.id);
    const spent = owned.reduce((s,p)=>s+(p.paid||0),0);
    const byRole = ROLES.reduce((o,r)=>{ o[r]=owned.filter(p=>p.role===r).length; return o; }, {});
    const slotsUsed = owned.length;
    const left = state.settings.budget - spent;
    const slotsFree = tot - slotsUsed;
    return { m, spent, left, byRole, slotsUsed, maxBid: Math.max(0, left - Math.max(0, slotsFree-1)) };
  });
}
/* sorveglianza reparti: dove la mia asta è in sofferenza + il miglior colpo libero */
/* Allerta reparti: non conta QUANTI giocatori restano (ce ne sono sempre a decine), ma
   quanta QUALITÀ resta rispetto a quella che si poteva avere, e solo per gli slot da
   TITOLARE ancora scoperti — le riserve si riempiono sempre. */
function roleWatch(){
  const mod = MODULES[state.lineup.module] || MODULES["3-4-3"];
  const needTit = { P:1, ...mod };
  const avgTop = (list, n) => { const s = list.slice(0, n); return s.length ? s.reduce((t,x)=>t+x,0)/s.length : 0; };
  return ROLES.map(r=>{
    const slotFree = Math.max(0, slotsLeft(r));
    const haveR = mine().filter(p=>p.role===r).length;
    const need = Math.max(0, needTit[r] - haveR);          // titolari ancora da prendere
    const all = state.players.filter(p=>p.role===r).map(p=>advice(kbFor(p)).exp||0).sort((a,b)=>b-a);
    const ranked = state.players.filter(p=>p.role===r && p.status==="free")
      .map(p=>({p,a:advice(kbFor(p))})).sort((x,y)=>(y.a.exp||0)-(x.a.exp||0));
    const freeExp = ranked.map(x=>x.a.exp||0);
    const n = Math.max(1, need);
    const perdita = avgTop(all, n) - avgTop(freeExp, n);    // quanto si è già impoverito il reparto
    const topLeft = ranked.filter(x=>x.a.tier==="must"||x.a.tier==="target").length;
    const best = ranked[0] || null;
    let level = "ok";
    if(need > 0 && slotFree > 0){
      if(perdita >= 0.45 || topLeft === 0) level = "crit";
      else if(perdita >= 0.22) level = "warn";
    }
    return { r, need, slotFree, topLeft, perdita, best, level };
  });
}
/* Come il regolamento della lega sposta il valore dei reparti:
   no      = niente modificatore difesa -> conta solo bonus: portiere/difesa pesano meno, spingi C/A
   dif4    = modificatore sui 4 migliori difensori (portiere escluso) -> i difensori regolari valgono di più
   reparto = modificatore su portiere + difensori -> anche un ottimo portiere diventa prezioso */
const RULE_MULT = {
  no:      {P:-0.14, D:-0.05, C:0, A:0.03},
  dif4:    {P:-0.04, D:0.16,  C:0, A:0},
  reparto: {P:0.22,  D:0.16,  C:0, A:0}
};
const RULE_LABEL = { no:"Nessun modificatore difesa", dif4:"Modificatore sui 4 difensori", reparto:"Modificatore difensori + portiere" };
function ruleMod(){ return (state && state.settings && state.settings.rules && state.settings.rules.modDef) || "no"; }
/* Il modificatore difesa si applica solo schierando ALMENO 4 difensori: con una difesa a 3
   non scatta, quindi moduli come il 3-4-3 vanificano il vantaggio del regolamento. */
const MOD_MIN_DIF = 4;
function modDifAttivo(){ const m = MODULES[state.lineup.module] || MODULES["3-4-3"]; return (m.D||0) >= MOD_MIN_DIF; }
function moduloCompatibile(){ return ruleMod()==="no" || modDifAttivo(); }
function moduliConModificatore(){ return Object.keys(MODULES).filter(k=>MODULES[k].D >= MOD_MIN_DIF); }
const uid = ()=> "l" + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36);
function freshLeague(name){ return { name: name || "Lega 1", state: freshState() }; }
function newStore(firstLeague){
  const id = uid();
  return { v:3, current:id, order:[id], leagues:{ [id]: firstLeague || freshLeague("Lega 1") } };
}
function currentLeague(){ return store.leagues[store.current]; }

function stateFromV1(raw){                // migra un vecchio state v1 (dati di esempio esclusi)
  const st = JSON.parse(raw);
  if(!st || !Array.isArray(st.players) || st.exampleData || !st.players.length) return null;
  const ns = freshState();
  ns.official = true;
  ns.players = st.players.map(p=>({...mkPlayer(p.id,p.name,p.team,p.role,p.qta,p.fvm),
    rating:p.rating||0, target:!!p.target, maxBid:p.maxBid||0, status:p.status||"free", paid:p.paid||0}));
  ns.nextId = Math.max(0,...ns.players.map(p=>p.id))+1;
  ns.settings = st.settings || ns.settings;
  return ns;
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      store = JSON.parse(raw);
      if(store && store.leagues && store.current && store.leagues[store.current]){
        for(const id of store.order) store.leagues[id].state = normState(store.leagues[id].state);
        state = currentLeague().state; return;
      }
    }
    const v2 = localStorage.getItem(OLD2);       // migrazione: stato singolo v2 -> lega 1
    if(v2){ store = newStore(freshLeague("Lega 1")); currentLeague().state = normState(JSON.parse(v2)); state = currentLeague().state; save(); return; }
    const v1 = stateFromV1(localStorage.getItem(OLD1) || "");
    if(v1){ store = newStore({name:"Lega 1", state:v1}); state = currentLeague().state; save(); return; }
  }catch(e){}
  store = newStore(); state = currentLeague().state; save();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); return true; }
  catch(e){ try{ toast("Salvataggio non riuscito: spazio del browser esaurito"); }catch(_){} return false; }
}

function selectLeague(id){
  if(!store.leagues[id]) return;
  store.current = id; state = currentLeague().state;
  undoStack = [];
  Object.assign(ui, { astaSel:null, openId:0, tradeGive:[], tradeGet:[], cmp:[], confirmReset:false, confirmSample:false });
  save();
}
function createLeague(name){
  const lg = freshLeague((name||"").trim() || ("Lega "+(store.order.length+1)));
  const id = uid();
  store.leagues[id] = lg; store.order.push(id);
  selectLeague(id);
  return id;
}
function renameLeague(id, name){ if(store.leagues[id]){ store.leagues[id].name = name || store.leagues[id].name; save(); } }
/* Copia ★ e voti da un'altra lega. I giocatori si agganciano per NOME+RUOLO (gli id sono
   locali alla lega). I TETTI NON si copiano: dipendono dal budget, dagli slot e dai crediti
   ancora liberi di questa lega, quindi vengono ricalcolati qui. Non sovrascrive mai:
   aggiunge solo ciò che manca, e salta chi è già stato assegnato all'asta. */
function copyTargetsFrom(srcId){
  const src = store.leagues[srcId];
  if(!src || !src.state || !Array.isArray(src.state.players)) return null;
  const key = p => norm(p.name)+"|"+p.role;
  const from = new Map();
  for(const p of src.state.players) if(p.target || p.rating>0) from.set(key(p), p);
  let stelle = 0, voti = 0, saltati = 0;
  for(const p of state.players){
    const o = from.get(key(p));
    if(!o) continue;
    /* il voto è un giudizio sul giocatore: vale anche se qui l'ha già preso qualcun altro
       (serve nel Confronto e negli Scambi) */
    if(o.rating>0 && !p.rating){ p.rating = o.rating; voti++; }
    if(o.target && !p.target){
      if(p.status !== "free"){ saltati++; continue; }   // già assegnato: inutile come obiettivo
      p.target = true; p.tgtWhy = o.tgtWhy || "mia";    // porta con sé il motivo dell'altra lega
      if(!p.maxBid) p.maxBid = tettoMax(p);
      stelle++;
    }
  }
  if(stelle || voti) save();
  return { stelle, voti, saltati };
}
function deleteLeague(id){
  if(!store.leagues[id] || store.order.length<=1) return false;
  delete store.leagues[id];
  store.order = store.order.filter(x=>x!==id);
  if(store.current===id) selectLeague(store.order[0]); else save();
  return true;
}

/* ================= motore consigli ================= */
/* Scala tarata sulle FANTAMEDIE UFFICIALI 2025-26 (regolamento standard).
   ROLE_MEAN = mediana reale di chi ha giocato; TH = soglie "da prendere"/"obiettivo",
   fissate sui percentili alti della distribuzione di FM attesa (vedi tools/scovatore.mjs).
   NB: la Fm ufficiale dei portieri è strutturalmente bassa (-1 per gol subito): 5.2 per un
   portiere vale quanto 6.6 per un attaccante, per questo ogni ruolo ha soglie proprie. */
const ROLE_MEAN = {P:5.17, D:5.94, C:6.23, A:6.60};
const TH = {P:[5.40,5.26], D:[6.48,6.16], C:[6.88,6.50], A:[7.50,6.94]};

function expFM(k){
  /* Pesi ricalibrati col backtest 25-26 (tools/backtest.mjs):
     - attacco squadra dimezzato (0.10→0.05): quota e FM lo prezzano già in gran parte
     - 35-37 anni ammorbidito (-0.15→-0.10) e bonus U21 rimosso (il dato non lo supporta)
     - xgd = correzione regressione xG calcolata dal builder (chi ha segnato sopra il
       proprio xG scende, chi ha raccolto meno di quanto creato sale) */
  const rm = ROLE_MEAN[k.r];
  const w = Math.min(1,(k.pres||0)/30);
  /* base pluriennale: 65% ultima stagione + 35% precedente (quando esiste un dato vero
     in entrambe). Misurato su 140 giocatori: -9% di errore rispetto alla sola ultima
     stagione, perché un'annata anomala regredisce verso lo standard personale. */
  const base = (!k.est && k.fm2>0) ? 0.65*k.fm + 0.35*k.fm2 : k.fm;
  let v = rm + (base-rm)*(0.35+0.65*w);
  if(k.est) v = rm + (v-rm)*0.9;
  const t = TEAMS[k.t]||{atk:3,def:3};
  v += (k.r==="A"||k.r==="C") ? (t.atk-3)*0.05 : (t.def-3)*(k.r==="P"?0.13:0.10);
  if(k.rig===2) v += 0.15; else if(k.rig===1) v += 0.05;   // xgd compensa chi li tirava già
  v += k.xgd||0;
  if(k.age>=38) v -= 0.25; else if(k.age>=35) v -= 0.10;
  if(k.inj>=3) v -= 0.20; else if(k.inj===2) v -= 0.10;
  if(k.newT) v -= 0.08;
  v += (RULE_MULT[ruleMod()]||RULE_MULT.no)[k.r] || 0;   // regolamento della lega (modificatore difesa)
  return v;
}
function affOf(k){ return Math.max(0, Math.min(100, k.tit - k.inj*8 - k.unc*10)); }

const ADV_META = {
  must:  {label:"Da prendere",     long:"Da prendere assolutamente", ord:0},
  target:{label:"Obiettivo",       long:"Obiettivi consigliati",     ord:1},
  bet:   {label:"Scommessa",       long:"Scommesse ad alto potenziale", ord:2},
  safe:  {label:"Usato sicuro",    long:"Usato sicuro",              ord:3},
  watch: {label:"Da monitorare",   long:"Rischi da monitorare",      ord:4},
  avoid: {label:"Da evitare",      long:"Da evitare a questi prezzi", ord:5},
  filler:{label:"Completamento",   long:"Completamento rosa",        ord:6},
  nd:    {label:"n/d",             long:"Senza dati storici",        ord:7}
};
function advice(k){
  if(!k) return {tier:"nd", exp:null, aff:null};
  const exp = expFM(k), aff = affOf(k), [hi,mid] = TH[k.r];
  let tier;
  if(k.unc>=2) tier = "watch";
  /* un infortunio lungo viene prima di ogni altra valutazione: senza questo controllo un
     titolare operato finiva classificato "Scommessa" grazie alle presenze dell'anno scorso */
  else if(k.inj>=3) tier = "watch";
  else if(exp>=hi && aff>=78) tier = "must";
  else if(exp>=mid && aff>=68) tier = "target";
  else if(k.up>=3 && (k.age<=23 || aff<70)) tier = "bet";
  else if(exp>=hi-0.15 && aff>=45) tier = "bet";   // forte ma senza posto fisso: scommessa, non completamento
  else if(k.inj>=2) tier = "watch";
  else if(aff>=85 && exp>=mid-0.35) tier = "safe";
  else if(exp<mid-0.45 && k.qta>=14) tier = "avoid";
  else tier = "filler";
  return {tier, exp, aff};
}
function chipsOf(k){
  const t = TEAMS[k.t]||{};
  const c = [];
  if(k.rig===2) c.push(["Rigorista","hot"]);
  else if(k.rig===1) c.push(["Rigore n.2",""]);
  if(k.unc>=2) c.push(["Futuro incerto","bad"]);
  if(k.newT) c.push(["Nuovo acquisto",""]);
  if(k.age<=21) c.push(["U21","good"]);
  if(k.age>=35) c.push([k.age+" anni",""]);
  if(k.inj>=2) c.push(["Rischio infortuni","bad"]);
  if(k.tit>=90) c.push(["Titolare fisso","good"]);
  else if(k.tit<60) c.push(["Rischio panchina","bad"]);
  else if(k.tit<70) c.push(["Ballottaggio",""]);
  if(k.pres>0 && k.pres<12) c.push([`Solo ${k.pres} presenze`,"bad"]);   // campione ridotto: giudizio meno affidabile
  /* Segnale empirico (tools/scovatore.mjs, 2 stagioni): tra i giocatori da pochi crediti,
     chi era già titolare l'anno scorso diventa titolare nel 53% dei casi contro un 19% medio;
     chi non ha mai messo piede in Serie A si ferma all'8%. È il filtro più affidabile per
     distinguere le occasioni vere dalle scommesse a vuoto. */
  /* Vale anche per chi arriva da fuori: se le probabili formazioni lo danno titolare,
     quell'informazione è più forte dello storico in Serie A (che lui non può avere).
     Senza questa seconda condizione il tag perdeva proprio i colpi migliori del mercato. */
  if(k.qta<=10 && (k.pres>=28 || k.tit>=88)) c.push(["Occasione affidabile","good"]);
  else if(k.qta<=10 && !k.newT && k.pres<=2) c.push(["Mai in campo in A","bad"]);
  /* A stagione iniziata il campo dice cose che nessuna probabile formazione sapeva. Sono
     due tag e non un giudizio: "ha preso voto in tutte le giornate" e "dato titolare ma non
     si è ancora visto". Fuori stagione (GIORNATE_GIOCATE = 0) non compaiono affatto, così il
     Listone d'agosto resta quello di prima. NB: prendere voto non vuol dire partire titolare
     — un subentrato entra nel conteggio — ma non prenderlo mai, quando ci si aspettava un
     titolare, è il segnale che all'asta di settembre vale di più. */
  /* Il tag chiede DUE cose insieme: che fosse atteso titolare e che il campo lo confermi.
     Col solo "ha preso voto ogni giornata" alla 1ª giornata il tag toccava 277 giocatori su
     516 — un filtro che seleziona metà del listone non seleziona niente. */
  if(GIORNATE_GIOCATE>0){
    if(k.pvOra===GIORNATE_GIOCATE && k.tit>=88 && k.inj<2) c.push(["Confermato dal campo","good"]);
    else if(k.pvOra===0 && k.tit>=70 && k.inj<2) c.push(["Non ancora visto","bad"]);
  }
  /* un rigorista designato che costa poco è il singolo profilo più sottovalutato all'asta */
  if(k.rig===2 && k.qta<=13) c.push(["Rigorista a poco prezzo","hot"]);
  if(k.up>=4) c.push(["Upside alto","good"]);
  if((k.r==="A"||k.r==="C") && t.atk>=5) c.push(["Attacco top","good"]);
  if((k.r==="P"||k.r==="D") && t.def>=5) c.push(["Difesa top","good"]);
  return c;
}
/* tag filtrabili: i 4 più usati come chip fissi, gli altri nella tendina "+ altri".
   Le etichette dinamiche ("36 anni", "Solo N presenze") restano solo informative. */
const TAGS_MAIN = ["Rigorista a poco prezzo","Occasione affidabile","Rigorista","Titolare fisso"];
const TAGS_MORE = ["Confermato dal campo","Non ancora visto","Attacco top","Difesa top","Rigore n.2","Ballottaggio","Rischio panchina","Mai in campo in A","Rischio infortuni","Futuro incerto","Nuovo acquisto","U21","Upside alto"];

function inflation(){
  const sold = state.players.filter(p=>p.status!=="free" && p.paid>0);
  const paid = sold.reduce((s,p)=>s+p.paid,0), base = sold.reduce((s,p)=>s+auctionPrice(p),0);
  const raw = base>0 ? paid/base : 1;
  const v = 1 + (raw-1)*Math.min(1, sold.length/12);
  /* LIMITE: nelle prime battute due o tre acquisti fuori scala (i primi nomi vengono
     sempre strapagati) facevano schizzare il moltiplicatore — con pochi dati il rapporto
     è instabile. Un'asta reale non si scosta di più del ±40% dai prezzi attesi. */
  return Math.max(0.7, Math.min(1.4, v));
}

/* ================= PREZZO D'ASTA ATTESO =================
   La quota del listone NON è il prezzo d'asta: è un indice di valore. Il prezzo vero lo dà
   il FVM (Fantavalore di Mercato), la stima ufficiale su base 1000 crediti costruita
   sull'andamento reale delle aste. Va però PARAMETRIZZATO sulla lega: si normalizza in modo
   che la somma dei prezzi dei giocatori che verranno assegnati esaurisca esattamente i
   crediti in circolazione (budget × numero squadre).
   Fallback sulla quota per chi non ha FVM (es. listoni importati senza quella colonna). */
const fvmOf = p => { const k = kbFor(p); return (p.fvm || (k && k.fvm) || 0); };
let _auctionCache = null;
function auctionBase(){
  const s = state.settings;
  const nTeams = Math.max(2, s.nTeams || 8);
  const slots = ROLES.reduce((t,r)=>t+s.slots[r], 0);
  const key = `${nTeams}|${slots}|${s.budget}|${state.players.length}`;
  if(_auctionCache && _auctionCache.key === key) return _auctionCache;
  const N = slots * nTeams;                                   // giocatori che verranno assegnati
  const B = s.budget * nTeams;                                // crediti totali in circolazione
  const vals = state.players.map(p=>({ v: fvmOf(p), q: p.qta }));
  const hasFVM = vals.some(x=>x.v > 0);
  const key2 = hasFVM ? "v" : "q";
  const top = vals.sort((a,b)=>b[key2]-a[key2]).slice(0, N);
  const sum = top.reduce((t,x)=>t + (hasFVM ? x.v : Math.pow(x.q, 1.75)), 0);
  _auctionCache = { key, hasFVM, K: Math.max(0, B - N) / (sum || 1) };
  return _auctionCache;
}
/* prezzo atteso al tavolo, prima delle correzioni */
function auctionPrice(p){
  const b = auctionBase();
  const base = b.hasFVM ? fvmOf(p) : Math.pow(p.qta, 1.75);
  return Math.max(1, Math.round(1 + b.K * base));
}
/* ---- VORP: valore sopra il sostituto ----
   Quanto un giocatore rende PIÙ dell'ultimo titolare che prenderesti comunque a 1 credito
   nello stesso ruolo. I crediti che la lega spende per ruolo (split di Strategia) vengono
   distribuiti in proporzione al VORP: è il "valore vero", che corregge il prezzo di mercato
   (i portieri hanno spread piccolo → mai strapagarli; gli attaccanti enorme). */
let _vorpCache = null;
function vorpBase(){
  const s = state.settings, nT = Math.max(2, s.nTeams||8);
  const key = `${store.current}|${nT}|${ROLES.map(r=>s.slots[r]).join(",")}|${s.budget}|${ROLES.map(r=>s.split[r]).join(",")}|${state.players.length}|${ruleMod()}`;
  if(_vorpCache && _vorpCache.key===key) return _vorpCache;
  const price = {}, rate = {};
  for(const r of ROLES){
    const N = s.slots[r]*nT;
    const pool = state.players.filter(p=>p.role===r).map(p=>({p, e:advice(kbFor(p)).exp||0})).sort((a,b)=>b.e-a.e).slice(0, N);
    const repl = pool.length ? pool[pool.length-1].e : 0;
    const tot = pool.reduce((t,x)=>t+Math.max(0, x.e-repl), 0);
    const B = Math.max(0, s.budget*nT*(s.split[r]||0)/100 - N);   // crediti oltre l'1 minimo a testa
    for(const x of pool) price[x.p.id] = 1 + (tot ? B*Math.max(0, x.e-repl)/tot : 0);
    /* tasso di cambio del reparto: quanti CREDITI vale un punto di fantamedia qui.
       Serve a convertire "quanto è più forte di X" in "quanto posso pagarlo più di X". */
    rate[r] = tot > 0 ? B/tot : 0;
  }
  _vorpCache = { key, price, rate };
  return _vorpCache;
}
function vorpPrice(p){ const v = vorpBase().price[p.id]; return v==null ? 1 : Math.max(1, Math.round(v)); }
/* ================= TETTO MASSIMO D'ASTA =================
   Non è il prezzo previsto (quello è una previsione, non un valore) né una percentuale
   fissa sopra di esso. È il punto di INDIFFERENZA: fin dove conviene spingersi prima che
   sia meglio mollare, prendere il piano B e tenersi la differenza per gli altri reparti.

     tetto = prezzo del piano B + (quanto è più forte di lui) × (crediti per punto di FM)

   Il tasso "crediti per punto di FM" esce dal budget del reparto (vorpBase.rate): nei
   reparti dove tutti si equivalgono un punto vale poco e il tetto resta basso; dove il
   salto di qualità è netto, vale molto e il tetto sale — con un motivo, non a caso.
   Il tetto PUÒ risultare sotto il prezzo previsto: significa che al prezzo di mercato quel
   giocatore, per la TUA ripartizione, non conviene — c'è un pari livello che costa meno.
   Limiti di sicurezza (il piano B potrebbe sfumare anche lui): mai sotto l'80% né sopra
   il 150% del prezzo previsto. */
/* spiegazione in chiaro del tetto: da dove esce il numero */
function tettoWhy(p){
  const a = advice(kbFor(p)); if(a.exp==null) return "";
  const alt = fallbackFor(p), tet = tettoMax(p), sugg = suggPrice(p);
  if(!alt) return `<div class="help" style="margin-top:6px">Nessuna alternativa equivalente più economica in questo ruolo: <b>tetto ${tet}</b> crediti.</div>`;
  const meglio = tet < sugg, f = ricchezza();
  return `<div class="help" style="margin-top:6px">
    <b>Perché ${tet} crediti:</b> se lo perdi il piano B è <b>${esc(alt.p.name)}</b> a ~${alt.c} crediti
    (FM ${fmt1(alt.e)} contro ${fmt1(a.exp)}). Oltre il tetto conviene prendere lui e tenere la differenza.
    ${meglio?` <b style="color:var(--danger)">Attenzione:</b> il prezzo atteso (${sugg}) è già sopra il tetto — a quella cifra non conviene.`:""}
    ${f>1.15?` <b style="color:var(--accent)">Hai crediti in abbondanza</b> per gli slot che ti restano: il tetto è già alzato del ${Math.round((f-1)*100)}%.`:""}
    ${f<0.85?` <b style="color:var(--warn)">Sei corto di crediti</b> per gli slot che ti restano: il tetto è abbassato.`:""}
  </div>`;
}
function fallbackFor(p){
  const cap = suggPrice(p);
  let best = null;
  for(const x of state.players){
    if(x.id===p.id || x.role!==p.role || x.status!=="free") continue;
    const a = advice(kbFor(x));
    if(a.exp==null || a.aff<60) continue;                 // un piano B deve giocare
    if(suggPrice(x) > cap) continue;                      // e costare meno di lui
    if(!best || a.exp > best.e) best = { p:x, e:a.exp, c:suggPrice(x) };
  }
  return best;
}
/* Quanto sei RICCO rispetto agli slot che ti restano: 1 a inizio asta, >1 se hai
   risparmiato (i crediti in mano valgono meno → puoi alzare i tetti), <1 se hai speso
   troppo. È il correttivo che impedisce di scivolare di piano B in piano B tenendosi i
   crediti inutilizzati: con pochi slot e molti crediti i tetti si alzano da soli. */
function ricchezza(){
  const s = state.settings;
  const slotTot = ROLES.reduce((t,r)=>t+s.slots[r], 0) || 1;
  const rif = s.budget / slotTot;                          // crediti per slot a inizio asta
  const liberi = totSlotsLeft();
  if(!liberi || !rif) return 1;
  return Math.max(0.6, Math.min(2, (budgetLeft()/liberi) / rif));
}
function tettoMax(p){
  const sugg = suggPrice(p), a = advice(kbFor(p));
  const f = ricchezza();
  const alt = a.exp==null ? null : fallbackFor(p);
  if(!alt) return Math.max(1, Math.ceil(sugg*1.10*Math.min(1.5,Math.max(1,f))));   // è unico
  const rate = (vorpBase().rate[p.role] || 0) * f;
  const val = alt.c + Math.max(0, a.exp - alt.e) * rate;
  const hi = sugg * 1.5 * Math.min(1.6, Math.max(1, f));
  const t = Math.max(1, Math.ceil(Math.min(hi, Math.max(sugg*0.8, val))));
  /* non ha senso un tetto oltre quello che puoi davvero offrire adesso */
  const cap = maxBid();
  return cap > 0 ? Math.min(t, cap) : t;
}
/* prezzo consigliato: prezzo d'asta atteso (FVM), tirato verso il valore VORP (entro ±25%),
   corretto per l'inflazione reale della tua asta e per il giudizio del motore.
   NB: la stellina NON alza il prezzo (lo faceva: creava un circolo vizioso nel generatore
   di obiettivi e gonfiava i tetti — il margine per i tuoi obiettivi è già nel tetto +5%). */
function suggPrice(p){
  const a = advice(kbFor(p));
  const bump = a.tier==="must"?1.12 : a.tier==="target"?1.05 : a.tier==="avoid"?0.85 : 1;
  const mkt = auctionPrice(p), val = vorpPrice(p);
  const base = Math.max(mkt*0.75, Math.min(mkt*1.25, 0.55*mkt + 0.45*val));
  return Math.max(1, Math.round(base * inflation() * bump));
}

/* ================= parser import ================= */
const MANTRA = /^(Por|Dc|Dd|Ds|B|E|M|C|W|T|A|Pc)(;(Por|Dc|Dd|Ds|B|E|M|C|W|T|A|Pc))*$/;
function parseListone(text){
  const rows = [];
  for(const rawLine of text.split(/\r?\n/)){
    const line = rawLine.trim();
    if(!line) continue;
    if(/nome|ruolo|squadra|quotazion/i.test(line) && !/\d/.test(line)) continue;
    let toks = line.includes("\t") ? line.split("\t") : line.includes(";") ? line.split(";") : line.split(/,|\s{2,}/);
    toks = toks.map(t=>t.trim()).filter(t=>t!=="");
    if(toks.length<3) continue;
    const ri = toks.findIndex(t=>/^[PDCA]$/i.test(t));
    if(ri===-1) continue;
    const role = toks[ri].toUpperCase();
    let i = ri+1;
    if(i<toks.length && MANTRA.test(toks[i]) && toks.length>i+2) i++;
    const name = toks[i], team = toks[i+1];
    if(!name || !team || /^\d+$/.test(name) || /^\d+$/.test(team)) continue;
    const id = /^\d+$/.test(toks[0]) ? toks[0] : ((ri>0 && /^\d+$/.test(toks[ri-1])) ? toks[ri-1] : "");   // codice ufficiale: di norma è la prima colonna (#/Id)
    const nums = toks.slice(i+2).map(Number).filter(n=>!isNaN(n));
    if(!nums.length) continue;
    const qta = nums[0];
    const fvm = nums.length>=7 ? nums[6] : (nums.length>=2 ? nums[nums.length-1] : 0);
    if(qta>0) rows.push({id, role, name, team, qta, fvm});
  }
  return rows;
}
function importListone(text){
  const rows = parseListone(text);
  if(!rows.length) return 0;
  const old = new Map(state.players.map(p=>[norm(p.name)+"|"+p.role, p]));
  state.players = rows.map(r=>{
    const prev = old.get(norm(r.name)+"|"+r.role);
    const p = mkPlayer(state.nextId++, r.name, r.team, r.role, r.qta, r.fvm);
    p.extId = r.id||"";
    const k = kbFor(p); if(k) p.kbi = k.i;
    if(prev){ p.rating=prev.rating; p.target=prev.target; p.maxBid=prev.maxBid; p.status=prev.status; p.paid=prev.paid; p.owner=prev.owner; }
    return p;
  });
  state.official = true;
  save();
  return rows.length;
}

/* ================= allineamento al database aggiornato =================
   Quando il database interno cambia (nuovo listone, mercato), sincronizza l'elenco
   giocatori CONSERVANDO i dati personali: rosa, prezzi pagati, voti, obiettivi, note. */
function syncWithKB(){
  const before = state.players.length;
  const byKey = new Map(state.players.map(p=>[norm(p.name)+"|"+p.role, p]));
  const used = new Set();
  let added = 0, updated = 0;
  const players = KBI.map((k,ix)=>{
    const key = norm(k.n)+"|"+k.r;
    const old = byKey.get(key);
    const p = mkPlayer(ix+1, k.n, k.t, k.r, k.qta, k.fvm||0, k.i);
    p.extId = k.extId||"";
    if(old){
      used.add(key);
      p.rating=old.rating; p.target=old.target; p.maxBid=old.maxBid;
      p.status=old.status; p.paid=old.paid; p.owner=old.owner; p.note=old.note; p.seq=old.seq;
      if(old.qta!==k.qta || norm(old.team)!==norm(k.t)) updated++;
    } else added++;
    return p;
  });
  /* i giocatori spariti dal listone ma che fanno parte di una rosa restano, per non
     falsare crediti e conteggi: vanno svincolati a mano se sono usciti davvero */
  const kept = state.players.filter(p=>!used.has(norm(p.name)+"|"+p.role) && p.status!=="free");
  kept.forEach((p,i)=>{ p.id = players.length+i+1; players.push(p); });
  const removed = before - (players.length - added - kept.length) - kept.length;
  state.players = players;
  state.nextId = players.length+1;
  state.official = !!DATA.official;
  save();
  return { added, updated, kept:kept.length, removed: Math.max(0, before + added - players.length) };
}

/* ================= lettura file .xlsx (senza librerie esterne) ================= */
const colOf = ref=>{ let s=0; for(const ch of ref){ const c=ch.charCodeAt(0); if(c>=65&&c<=90) s=s*26+(c-64); else break; } return s-1; };
async function inflateRaw(u8){
  if(typeof DecompressionStream==="undefined") throw new Error("Il browser non supporta la lettura .xlsx: incolla le righe o salva in CSV.");
  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function xlsxToText(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let eo=-1;
  for(let i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){ eo=i; break; } }
  if(eo<0) throw new Error("File .xlsx non valido.");
  const cdOff=dv.getUint32(eo+16,true), cnt=dv.getUint16(eo+10,true);
  const entries={}; let p=cdOff;
  for(let n=0;n<cnt;n++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), compSize=dv.getUint32(p+20,true);
    const nameLen=dv.getUint16(p+28,true), extraLen=dv.getUint16(p+30,true), commLen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nameLen));
    entries[name]={method,compSize,lho};
    p+=46+nameLen+extraLen+commLen;
  }
  const readEntry=async name=>{
    const e=entries[name]; if(!e) return null;
    const nl=dv.getUint16(e.lho+26,true), xl=dv.getUint16(e.lho+28,true);
    const start=e.lho+30+nl+xl;
    const comp=u8.subarray(start,start+e.compSize);
    const raw=e.method===0?comp:await inflateRaw(comp);
    return new TextDecoder("utf-8").decode(raw);
  };
  const ssXml=await readEntry("xl/sharedStrings.xml");
  const shared=ssXml?[...new DOMParser().parseFromString(ssXml,"application/xml").getElementsByTagName("si")]
    .map(si=>[...si.getElementsByTagName("t")].map(t=>t.textContent).join("")):[];
  // scegli il foglio con più righe (il listone completo)
  let best="", bestRows=-1;
  for(const nm of Object.keys(entries)){
    if(!/^xl\/worksheets\/sheet\d+\.xml$/.test(nm)) continue;
    const xml=await readEntry(nm); if(!xml) continue;
    const nr=(xml.match(/<row\b/g)||[]).length;
    if(nr>bestRows){ bestRows=nr; best=xml; }
  }
  if(!best) throw new Error("Nessun foglio dati nel file.");
  const doc=new DOMParser().parseFromString(best,"application/xml");
  const lines=[...doc.getElementsByTagName("row")].map(row=>{
    const arr=[];
    for(const c of row.getElementsByTagName("c")){
      const col=colOf(c.getAttribute("r")||"A");
      const t=c.getAttribute("t"); const vEl=c.getElementsByTagName("v")[0];
      let val="";
      if(t==="s") val=shared[+(vEl?vEl.textContent:0)]||"";
      else if(t==="inlineStr"){ const tt=c.getElementsByTagName("t")[0]; val=tt?tt.textContent:""; }
      else val=vEl?vEl.textContent:"";
      arr[col]=val;
    }
    return arr.map(x=>x==null?"":x).join("\t");
  });
  return lines.join("\n");
}
async function importListoneFile(file){
  const isXlsx=/\.xlsx?$/i.test(file.name)||/\.xlsx$/i.test(file.name);
  if(/\.xlsx$/i.test(file.name)){
    const buf=await file.arrayBuffer();
    const text=await xlsxToText(buf);
    return importListone(text);
  }
  return importListone(await file.text());
}

/* ================= import rose di tutti (formato $,$,$ Fantacalcio) ================= */
function importRoseCsv(text){
  if(!state.players.some(p=>p.extId)) return {err:"Prima importa il listone ufficiale: servono i codici Id per abbinare i giocatori."};
  const byExt=new Map(state.players.filter(p=>p.extId).map(p=>[String(p.extId),p]));
  const order=[]; const map=new Map();
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim(); if(!line) continue;
    const parts=line.split(",").map(s=>s.trim());
    if(parts.length<3) continue;
    const team=parts[0], id=parts[1], cost=parts[2];
    if(team==="$"||!/^\d+$/.test(id)) continue;
    if(!map.has(team)){ map.set(team,[]); order.push(team); }
    map.get(team).push({id, cost:+cost||0});
  }
  if(!order.length) return {err:"Nessuna riga valida (formato atteso: Squadra,Id,Costo)."};
  state.players.forEach(p=>{ p.status="free"; p.paid=0; p.owner=null; p.seq=0; });
  state.managers=order.map((name,ix)=>({id:"m"+ix+"_"+Math.random().toString(36).slice(2,6), name}));
  state.settings.nTeams=order.length+1;
  let matched=0, unmatched=0, seq=0;
  order.forEach((name,ix)=>{
    for(const {id,cost} of map.get(name)){
      const pl=byExt.get(String(id));
      if(pl){ pl.status="gone"; pl.owner=state.managers[ix].id; pl.paid=cost; pl.seq=++seq; matched++; }
      else unmatched++;
    }
  });
  state.seq=seq; save();
  return {teams:order.length, matched, unmatched};
}
function claimTeam(mgrId){
  const m=state.managers.find(x=>x.id===mgrId); if(!m) return false;
  state.players.forEach(p=>{ if(p.status==="gone"&&p.owner===mgrId){ p.status="mine"; p.owner=null; } });
  state.managers=state.managers.filter(x=>x.id!==mgrId);
  state.settings.nTeams=state.managers.length+1;
  state.settings.myTeam=m.name;
  undoStack=[]; save(); return true;
}

/* ================= export CSV rose (formato Leghe Fantacalcio) =================
   Formato reale: blocchi separati da una riga "$,$,$", righe "Fantasquadra,Id,Costo".
   Conta solo il codice Id del calciatore (viene dal listone ufficiale importato). */
function downloadFile(name, text, mime){
  const blob = new Blob([text], {type:(mime||"text/csv")+";charset=utf-8"});
  const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  URL.revokeObjectURL(a.href);
}
function myTeamName(){ return (state.settings.myTeam||"").trim() || "La mia squadra"; }
function exportRoseCsv(all){
  const clean = t=>String(t||"").replace(/,/g," ").trim();      // niente virgole nei nomi
  const byRole = (a,b)=>ROLES.indexOf(a.role)-ROLES.indexOf(b.role) || (b.paid||0)-(a.paid||0);
  const teams = all
    ? [{name:myTeamName(), players:mine()}].concat(state.managers.map(m=>({name:m.name, players:state.players.filter(p=>p.status==="gone"&&p.owner===m.id)})))
    : [{name:myTeamName(), players:mine()}];
  let count=0, missing=0;
  const lines=[];
  for(const t of teams){
    lines.push("$,$,$");
    for(const p of t.players.slice().sort(byRole)){
      if(!p.extId){ missing++; continue; }
      lines.push([clean(t.name), p.extId, p.paid||0].join(","));
      count++;
    }
  }
  if(!count) return {count:0, missing};
  downloadFile(`fantahq-rose-${all?"tutte":"mia"}.csv`, lines.join("\r\n"));
  return {count, missing};
}

const encState = st=>({ o:st.official?1:0, s:st.settings, d:st.teamsDiff, a:st.avail||{}, l:st.lineup, m:st.managers||[], q:st.seq||0, g:st.giornata||1, rm:st.rivalMod||{},
  p: st.players.map(p=>[p.role,p.name,p.team,p.qta,p.fvm,p.rating,p.target?1:0,p.maxBid,(p.status==="mine"?1:p.status==="gone"?2:0),p.paid,p.owner||"",p.seq||0,p.extId||"",p.note||""]) });
function decState(o){
  const st = freshState();
  st.official = !!o.o; st.settings = o.s||st.settings; st.teamsDiff = o.d||{}; st.avail = o.a||{}; st.lineup = o.l||st.lineup;
  st.managers = Array.isArray(o.m)?o.m:[]; st.seq = o.q||0;
  st.giornata = Math.max(1,Math.min(38,+o.g||1)); st.rivalMod = (o.rm && typeof o.rm==="object") ? o.rm : {};
  st.players = (o.p||[]).map((a,i)=>{
    const p = mkPlayer(i+1, a[1], a[2], a[0], a[3], a[4]);
    p.rating=a[5]||0; p.target=!!a[6]; p.maxBid=a[7]||0; p.status=a[8]===1?"mine":a[8]===2?"gone":"free"; p.paid=a[9]||0;
    p.owner=a[10]||null; p.seq=a[11]||0; p.extId=a[12]||""; p.note=a[13]||"";
    return p;
  });
  st.nextId = st.players.length+1;
  return normState(st);
}
function b64(obj){ return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }
function unb64(s){ return JSON.parse(decodeURIComponent(escape(atob(s)))); }

function syncCode(){                       // FHQ2 = tutte le leghe
  const payload = { current:store.current, order:store.order,
    leagues: Object.fromEntries(store.order.map(id=>[id, {name:store.leagues[id].name, st:encState(store.leagues[id].state)}])) };
  return "FHQ2." + b64(payload);
}
function loadSyncCode(code){
  code = (code||"").trim();
  try{
    if(code.startsWith("FHQ2.")){
      const pl = unb64(code.slice(5));
      if(!pl.order || !pl.order.length) throw 0;
      store = { v:3, current:pl.current, order:pl.order,
        leagues: Object.fromEntries(pl.order.map(id=>[id, {name:pl.leagues[id].name, state:decState(pl.leagues[id].st)}])) };
      if(!store.leagues[store.current]) store.current = store.order[0];
      state = currentLeague().state; save(); return null;
    }
    if(code.startsWith("FHQ1.")){          // vecchio codice a lega singola -> nuova lega
      const pl = unb64(code.slice(5));
      if(!Array.isArray(pl.players) || !pl.players.length) throw 0;
      const st = decState({o:pl.official?1:0, s:pl.settings, d:pl.teamsDiff, a:pl.avail, l:pl.lineup,
        p:pl.players});
      store = newStore({name:"Lega importata", state:st}); state = currentLeague().state; save(); return null;
    }
    return "Codice non valido: deve iniziare con FHQ2. (o FHQ1.)";
  }catch(e){ return "Codice non leggibile: ricopialo per intero."; }
}

/* coppie portieri consigliate: un titolare + il suo secondo (stesso club, spesa minima)
   oppure un secondo titolare economico di un'altra squadra */
function gkPairs(){
  const ks = state.players.filter(p=>p.role==="P").map(p=>({p,k:kbFor(p),a:advice(kbFor(p))})).filter(x=>x.k);
  ks.sort((a,b)=>b.a.exp-a.a.exp);
  const pairs=[]; const used=new Set();
  for(const pr of ks.slice(0,6)){
    if(used.has(pr.p.id)) continue;
    const sameClub = ks.find(x=>x.p.id!==pr.p.id && x.p.team===pr.p.team);
    let second, why;
    if(sameClub){ second=sameClub; why="il suo secondo di squadra: spendi pochissimo e sei coperto quando riposa"; }
    else { second = ks.filter(x=>x.p.id!==pr.p.id && x.p.team!==pr.p.team && x.k.tit>=80 && !used.has(x.p.id)).sort((a,b)=>a.p.qta-b.p.qta)[0];
      why = "un secondo titolare economico di un'altra squadra"; }
    if(second){ pairs.push({pr,second,why}); used.add(pr.p.id); used.add(second.p.id); }
    if(pairs.length>=3) break;
  }
  return pairs;
}
function gkPairsHtml(){
  const pairs = gkPairs();
  if(!pairs.length) return "";
  return `<div class="card">
    <h2>Coppie portieri consigliate</h2>
    <p class="sub">Partite dai portieri: qui trovi un titolare affidabile abbinato a un secondo sensato, così copri lo slot senza sprechi.</p>

/* mercato di riparazione: a rosa fatta, per ogni reparto confronta il tuo peggiore
   con il miglior svincolato ancora libero e suggerisce l'upgrade */
function repairSuggestions(){
  const my = mine(); if(!my.length) return [];
  const out=[];
  for(const r of ROLES){
    const mineR = my.map(p=>({p,a:advice(kbFor(p))})).filter(x=>x.p.role===r && x.a.exp!=null).sort((a,b)=>a.a.exp-b.a.exp);
    const freeR = state.players.filter(p=>p.role===r&&p.status==="free").map(p=>({p,a:advice(kbFor(p))})).filter(x=>x.a.exp!=null).sort((a,b)=>b.a.exp-a.a.exp);
    if(!mineR.length||!freeR.length) continue;
    const worst=mineR[0], best=freeR[0];
    const delta=(best.a.exp||0)-(worst.a.exp||0);
    if(delta>=0.4) out.push({r,worst,best,delta});
  }
  return out.sort((a,b)=>b.delta-a.delta);
}

/* ================= auto-rosa ottimale =================
   Per ogni reparto risolve uno zaino (knapsack) 0/1: scegliere esattamente N giocatori
   entro il budget del reparto massimizzando il valore. I giocatori sono ordinati per FM
   attesa, così il j-esimo scelto è il j-esimo migliore: i titolari (secondo il modulo)
   contano pieno, le riserve pesano molto meno — perché in campo ne vanno 11, non 25. */
/* Quanto pesano le riserve nel piano. Di default poco (0.35): in campo ne vanno 11 e gli
   ultimi slot si chiudono con 1 credito. Con "panchina profonda" salgono a 0.75: il piano
   spende meno sui titolari e compra riserve vere — costa qualcosa in resa dell'undici, ma
   copre infortuni, turnover e squalifiche. */
const deepBench = () => state.settings.deepBench !== false;   // predefinito: panchina profonda
const benchW = () => deepBench() ? 0.75 : 0.35;
/* Zaino 0/1 per un singolo reparto: esattamente n giocatori entro il budget B. */
function solveRole(r, n, B, need){
  const NEG = -1e9;
  /* Candidati = i migliori per rendimento PIÙ i più economici: con un budget ridotto
     (metà asta) i soli top non permettono di riempire gli slot e il piano resterebbe vuoto. */
  const pool = state.players.filter(p=>p.role===r && p.status==="free")
    /* Il valore su cui si ottimizza NON è la fantamedia pura, ma la RESA ATTESA: un giocatore
       con affidabilità 60 scende in campo in circa 6 partite su 10, nelle altre schieri un
       sostituto. Quindi resa = aff × fantamedia + (1-aff) × media del ruolo.
       Senza questa correzione il piano metteva tra i titolari gente da 42-60 di titolarità
       solo perché ha una bella fantamedia — un undici che sulla carta non esiste. */
    .map(p=>{
      const a = advice(kbFor(p)), raw = a.exp||0;
      const q = Math.max(0, Math.min(1, (a.aff||0)/100));
      return { p, e: raw>0 ? q*raw + (1-q)*ROLE_MEAN[p.role] : 0, e0: raw, aff: a.aff||0,
               c: Math.max(1, suggPrice(p)) };
    })
    /* fuori chi non puoi davvero comprare: in uscita dal club o fermo a lungo per infortunio.
       Senza questo filtro il piano proponeva un vice in partenza o un lungodegente. */
    .filter(x=>{ const k=kbFor(x.p); return x.e>0 && k && k.unc<2 && k.inj<3; });
  const byVal = pool.slice().sort((a,b)=>b.e-a.e).slice(0, 45);
  const byPrice = pool.slice().sort((a,b)=>a.c-b.c || b.e-a.e).slice(0, 25);
  const cands = [...new Set([...byVal, ...byPrice])].sort((a,b)=>b.e-a.e);
  if(!n || cands.length < n) return { picks:[], cost:0, value:0, budget:B, ok:false };
  const W = B+1;
  const dp = Array.from({length:n+1}, ()=>new Float64Array(W).fill(NEG));
  dp[0][0] = 0;
  const chosen = [];
  for(let i=0;i<cands.length;i++){
    const { e, c } = cands[i];
    const mark = new Uint8Array((n+1)*W);
    for(let j=n-1;j>=0;j--){
      const w = j < need ? 1 : benchW();          // j = quanti già presi = rango del nuovo
      const row = dp[j], next = dp[j+1];
      for(let b=0;b+c<W;b++){
        const cur = row[b];
        if(cur===NEG) continue;
        const v = cur + e*w;
        if(v > next[b+c]){ next[b+c] = v; mark[(j+1)*W + (b+c)] = 1; }
      }
    }
    chosen.push(mark);
  }
  let bestB = -1, bestV = NEG;
  for(let b=0;b<W;b++) if(dp[n][b] > bestV){ bestV = dp[n][b]; bestB = b; }
  if(bestB < 0) return { picks:[], cost:0, value:0, budget:B, ok:false };
  const picks = [];
  let j = n, b = bestB;
  for(let i=cands.length-1;i>=0 && j>0;i--){
    if(chosen[i][j*W + b]){ picks.push(cands[i]); b -= cands[i].c; j--; }
  }
  picks.reverse();
  return { picks, cost:picks.reduce((t,x)=>t+x.c,0), value:bestV, budget:B, ok:true };
}
/* Rosa ottimale: risolve ogni reparto e poi REDISTRIBUISCE i crediti avanzati al reparto
   dove rendono di più — altrimenti si arriva a fine asta con crediti inutilizzati. */
function optimalSquad(strategy){
  const s = state.settings;
  const mod = MODULES[state.lineup.module] || MODULES["3-4-3"];
  const need = { P:1, ...mod };
  const split = strategy ? PRESETS[strategy] : s.split;
  /* Pianifica sul RESIDUO: se l'asta è già iniziata, contano solo gli slot ancora da
     riempire e i crediti che restano — così il piano resta valido a metà asta. */
  const budget = budgetLeft();
  const slotN = {}, needLeft = {};
  for(const r of ROLES){
    slotN[r] = Math.max(0, slotsLeft(r));
    const presiTit = Math.min(mine().filter(p=>p.role===r).length, need[r]);
    needLeft[r] = Math.max(0, need[r] - presiTit);
  }
  /* Riparto il budget garantendo PRIMA a ogni reparto il minimo per riempire i suoi slot
     (≈2 crediti a slot) e distribuendo solo l'eccedenza secondo la strategia: altrimenti,
     a fine asta con pochi crediti, un reparto resterebbe senza proposte. */
  const roles = {}, base = {};
  const reserve = {}; let totRes = 0;
  for(const r of ROLES){ reserve[r] = slotN[r] * 2; totRes += reserve[r]; }
  const extra = Math.max(0, budget - totRes);
  let ok = true;
  for(const r of ROLES){
    base[r] = totRes > budget
      ? Math.max(slotN[r], Math.floor(budget * (reserve[r] / (totRes||1))))
      : reserve[r] + Math.floor(extra * (split[r]||0) / 100);   // floor: gli arrotondamenti non devono far sforare il totale
    roles[r] = solveRole(r, slotN[r], base[r], needLeft[r]);
    if(!roles[r].ok && slotN[r]) ok = false;
  }
  /* Redistribuzione dell'avanzo al reparto dove rende di più, con un TETTO del +50% sul
     budget di partenza: senza tetto ogni preset convergerebbe alla stessa rosa, annullando
     la scelta strategica dell'utente (es. "modificatore difesa"). */
  for(let round=0; round<5; round++){
    const spent = ROLES.reduce((t,r)=>t+roles[r].cost, 0);
    const left = budget - spent;
    if(left < 3) break;
    let bestR = null, bestGain = 0.02, bestSol = null;
    for(const r of ROLES){
      if(!slotN[r]) continue;
      /* primi giri: tetto che preserva la strategia; ultimi giri: tetto libero, così
         i crediti che restano vengono comunque investiti invece di andare sprecati */
      const cap = round < 3 ? Math.round(base[r] * 1.5) : budget;
      /* si parte dalla spesa EFFETTIVA, non dal budget assegnato: sommare l'avanzo a un
         budget non speso lo conterebbe due volte e la rosa finirebbe fuori budget */
      const nb = Math.min(roles[r].cost + left, cap);
      if(nb <= roles[r].budget) continue;
      const sol = solveRole(r, slotN[r], nb, needLeft[r]);
      const gain = sol.value - roles[r].value;
      if(sol.ok && gain > bestGain){ bestGain = gain; bestR = r; bestSol = sol; }
    }
    if(!bestR) break;
    roles[bestR] = bestSol;
  }
  const total = ROLES.reduce((t,r)=>t+roles[r].cost, 0);
  const value = ROLES.reduce((t,r)=>t+roles[r].value, 0);
  return { roles, total, value, ok };
}
/* ================= RIPARTIZIONE OTTIMA, CALCOLATA =================
   I tre preset sono valori di convenzione, uguali per tutti. Qui la ripartizione viene
   CALCOLATA sui giocatori ancora liberi: per ogni reparto si costruisce la curva "con b
   crediti quanto valore riesco a comprare", poi si cerca la combinazione di budget che
   massimizza il totale. Cambia con le squadre in lega, il budget, il modulo, il regolamento
   e con chi è già stato venduto — quindi va ricalcolata anche a metà asta.

   Il prezzo usato è quello di MERCATO (auctionPrice), non il prezzo consigliato: il
   consigliato dipende dalla ripartizione, e usarlo qui creerebbe un circolo vizioso
   (la ripartizione deciderebbe i prezzi che servono a decidere la ripartizione). */
function curvaReparto(r, n, need, maxB, tutti){
  const NEG = -1e9, W = maxB + 1;
  /* tutti = piano di partenza: si ragiona sul listone intero, come se l'asta non fosse
     ancora iniziata. Altrimenti si guarda solo a chi è ancora libero. */
  const pool = state.players.filter(p => p.role === r && (tutti || p.status === "free"))
    .map(p => {
      const a = advice(kbFor(p)), raw = a.exp || 0;
      const q = Math.max(0, Math.min(1, (a.aff || 0) / 100));
      /* stessa resa attesa di solveRole: chi non gioca vale meno, perché nelle giornate
         in cui manca schieri comunque un sostituto da media di ruolo */
      return { e: raw > 0 ? q * raw + (1 - q) * ROLE_MEAN[r] : 0,
               c: Math.max(1, auctionPrice(p)), k: kbFor(p) };
    })
    .filter(x => x.e > 0 && x.k && x.k.unc < 2 && x.k.inj < 3)
    .sort((a, b) => b.e - a.e).slice(0, 60);
  if(pool.length < n) return null;
  const dp = Array.from({length: n+1}, () => new Float64Array(W).fill(NEG));
  dp[0][0] = 0;
  for(const x of pool){
    for(let j = n-1; j >= 0; j--){
      const w = j < need ? 1 : benchW();     // j = quanti già presi = rango del nuovo
      const row = dp[j], next = dp[j+1];
      for(let b = W-1-x.c; b >= 0; b--){
        const cur = row[b];
        if(cur === NEG) continue;
        const v = cur + x.e * w;
        if(v > next[b + x.c]) next[b + x.c] = v;
      }
    }
  }
  /* curva cumulativa: "con AL PIÙ b crediti", così spendere meno non è mai penalizzato */
  const f = new Float64Array(W).fill(NEG);
  let best = NEG;
  for(let b = 0; b < W; b++){ if(dp[n][b] > best) best = dp[n][b]; f[b] = best; }
  return f;
}
/* unisce due curve: per ogni budget complessivo tiene la spartizione migliore fra le due */
function fondiCurve(f1, f2, B){
  const NEG = -1e9, out = new Float64Array(B+1).fill(NEG), cut = new Int32Array(B+1);
  for(let b = 0; b <= B; b++){
    let bv = NEG, bc = 0;
    for(let x = 0; x <= b; x++){
      const a = f1[x], c = f2[b-x];
      if(a === NEG || c === NEG) continue;
      const v = a + c;
      if(v > bv){ bv = v; bc = x; }
    }
    out[b] = bv; cut[b] = bc;
  }
  return { out, cut };
}
/* Due domande diverse, due risposte diverse:
   - "piano"   = con quale ripartizione ENTRO all'asta. Si calcola sul listone intero e sul
                 budget pieno, quindi NON cambia mentre l'asta procede: è il numero stabile
                 da sapere prima di iniziare.
   - "residuo" = da qui in avanti, con i crediti e gli slot che mi restano e i giocatori
                 ancora liberi. Serve solo a metà asta, quando il piano è già stato scosso. */
function splitOttimale(modo){
  const piano = modo !== "residuo";
  const s = state.settings;
  const mod = MODULES[state.lineup.module] || MODULES["3-4-3"];
  const need = { P:1, ...mod };
  const B = Math.max(4, (piano ? s.budget : budgetLeft())|0);
  const slotN = {}, needLeft = {};
  for(const r of ROLES){
    slotN[r] = piano ? s.slots[r] : Math.max(0, slotsLeft(r));
    const presiTit = Math.min(mine().filter(p => p.role === r).length, need[r]);
    needLeft[r] = piano ? need[r] : Math.max(0, need[r] - presiTit);
  }
  if(ROLES.every(r => slotN[r] === 0)) return null;      // rosa già completa
  const curve = {};
  for(const r of ROLES){
    /* un reparto già pieno contribuisce con una curva piatta a zero: non chiede crediti */
    curve[r] = slotN[r] === 0 ? new Float64Array(B+1) : curvaReparto(r, slotN[r], needLeft[r], B, piano);
    if(!curve[r]) return null;                 // reparto senza abbastanza giocatori liberi
  }
  const m1 = fondiCurve(curve.P, curve.D, B);          // P+D
  const m2 = fondiCurve(m1.out, curve.C, B);           // (P+D)+C
  const m3 = fondiCurve(m2.out, curve.A, B);           // (P+D+C)+A
  if(m3.out[B] <= -1e8) return null;
  const bPD_C = m3.cut[B],  bA = B - bPD_C;
  const bPD   = m2.cut[bPD_C], bC = bPD_C - bPD;
  const bP    = m1.cut[bPD],   bD = bPD - bP;
  const cred  = { P:bP, D:bD, C:bC, A:bA };
  /* da crediti a percentuali intere che sommano esattamente 100 (resto al reparto più grosso) */
  const pct = {}; let tot = 0;
  for(const r of ROLES){ pct[r] = Math.round(cred[r] / B * 100); tot += pct[r]; }
  if(tot !== 100){
    const big = ROLES.slice().sort((a,b) => pct[b] - pct[a])[0];
    pct[big] += 100 - tot;
  }
  return { ...pct, crediti: cred, valore: m3.out[B] };
}

/* ================= QUALE MODULO CONVIENE =================
   All'asta non si compra un modulo: si comprano 25 giocatori, e la formazione si cambia ogni
   settimana. Quello che il modulo decide davvero è COME RIPARTIRE I SOLDI — quanti titolari
   di qualità servono per reparto. Qui si risponde con i numeri: per ogni modulo si risolve la
   rosa ottimale col budget disponibile e si confronta la qualità dell'undici che ne esce.
   Col modificatore difesa attivo i moduli sotto i 4 difensori non lo fanno scattare: il
   confronto lo tiene già in conto, perché le FM attese sono corrette dal regolamento. */
let _moduliCache = null;
function confrontoModuli(){
  const s = state.settings;
  const key = `${store.current}|${s.budget}|${ROLES.map(r=>s.slots[r]).join(",")}|${ROLES.map(r=>s.split[r]).join(",")}|${ruleMod()}|${ui.squadStrategy||""}|${deepBench()?1:0}|${budgetLeft()}|${state.players.filter(p=>p.status!=="free").length}`;
  if(_moduliCache && _moduliCache.key===key) return _moduliCache.righe;
  const orig = state.lineup.module, origMod = ruleMod();
  const righe = [];
  for(const m of Object.keys(MODULES)){
    state.lineup.module = m;
    /* confronto onesto: un modulo con meno di 4 difensori NON incassa il modificatore,
       quindi per quel modulo le FM vanno calcolate senza il bonus. Senza questo accorgimento
       una difesa a 3 risultava in testa godendo di un bonus che non prenderebbe mai. */
    state.settings.rules.modDef = MODULES[m].D >= MOD_MIN_DIF ? origMod : "no";
    const plan = optimalSquad(ui.squadStrategy || null);
    const need = {P:1, ...MODULES[m]};
    let somma = 0, n = 0;
    for(const r of ROLES){
      for(const x of (plan.roles[r]?.picks||[]).slice(0, need[r])){ somma += x.e; n++; }
    }
    righe.push({ m, fm: n ? somma/n : 0, costo: plan.total, ok: plan.ok,
                 mod: MODULES[m].D >= MOD_MIN_DIF });
  }
  state.lineup.module = orig;
  state.settings.rules.modDef = origMod;
  _moduliCache = { key, righe };
  return righe;
}
function moduliHtml(){
  const righe = confrontoModuli().slice().sort((a,b)=>b.fm-a.fm);
  if(!righe.length || !righe[0].fm) return "";
  const best = righe[0], cur = righe.find(x=>x.m===state.lineup.module);
  const max = best.fm, min = Math.min(...righe.map(x=>x.fm));
  const rows = righe.map(x=>{
    const w = max>min ? 8 + 92*(x.fm-min)/(max-min) : 100;
    return `<div class="bar">
      <div class="lab">${x.m===state.lineup.module?"▶ ":""}${x.m}${ruleMod()!=="no"&&!x.mod?' <span class="kchip bad">no mod.</span>':""}</div>
      <div class="track"><div class="fill" style="width:${w}%;background:${x.m===best.m?"var(--accent)":"var(--border)"}"></div></div>
      <div class="val">${fmt1(x.fm)} · ${x.costo} cr</div>
    </div>`;
  }).join("");

  return `<div class="card">

      cur && best.m===cur.m
        ? `Stai già sul modulo migliore (<b>${best.m}</b>): con questa rosa disponibile è la ripartizione che rende di più.`
        : diff < 0.06
          ? `<b>${best.m}</b> è in testa ma il vantaggio su <b>${state.lineup.module}</b> è minimo (${diff.toFixed(2)} di fantamedia): scegli in base ai giocatori che riesci davvero a prendere, non al modulo.`
          : `Conviene puntare sul <b>${best.m}</b>: rende <b>${diff.toFixed(2)}</b> di fantamedia in più a undici rispetto al tuo attuale ${state.lineup.module}. ${MODULES[best.m].D>=MOD_MIN_DIF&&ruleMod()!=="no"?"Fa anche scattare il modificatore difesa. ":""}Cambialo dal tab Formazione.`
    } Ricorda che in stagione puoi cambiare modulo ogni giornata: questo dice su cosa <b>investire</b>, non come schierarti per forza.</p>
