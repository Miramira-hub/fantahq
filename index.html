/* ================= CONCENTRAZIONE PER SQUADRA =================
   Il knapsack massimizza la resa attesa e non sa che le squadre esistono: può proporti
   tre attaccanti titolari della stessa squadra. Sulla carta è ottimo, in pratica è un
   undici che vive e muore su una partita sola — quando quella squadra gioca male, il
   reparto intero fa 6 di media. Non è un errore di previsione, è rischio non pagato:
   la resa attesa resta identica, la varianza raddoppia.
   Non tocco la scelta del motore: la segnalo, e decidi tu. */
function allertaConcentrazione(plan, need){
  const avvisi = [];
  const NOMI = { P:"portieri", D:"difensori", C:"centrocampisti", A:"attaccanti" };
  for(const r of ROLES){
    const tit = (plan.roles[r]?.picks || []).slice(0, need[r]);
    if(tit.length < 2) continue;
    const conta = {};
    for(const x of tit) conta[x.p.team] = (conta[x.p.team] || 0) + 1;
    for(const [team, n] of Object.entries(conta)){
      /* scatta dalla maggioranza in su: 2 su 3 basta, è già la stessa partita */
      if(n < 2 || n / tit.length < 0.6) continue;
      avvisi.push(n === tit.length
        ? `<b>${n} ${NOMI[r]} titolari su ${tit.length} giocano tutti nella stessa squadra (${team})</b>`
        : `<b>${n} dei ${tit.length} ${NOMI[r]} titolari giocano nella stessa squadra (${team})</b>`);
    }
  }
  /* e il caso più insidioso: un solo club che copre mezzo undici titolare */
  const tuttiTit = ROLES.flatMap(r => (plan.roles[r]?.picks || []).slice(0, need[r]));
  const perClub = {};
  for(const x of tuttiTit) perClub[x.p.team] = (perClub[x.p.team] || 0) + 1;
  const grosso = Object.entries(perClub).sort((a,b) => b[1]-a[1])[0];
  if(grosso && grosso[1] >= 4) avvisi.push(`<b>${grosso[1]} titolari su ${tuttiTit.length} giocano nella stessa squadra (${grosso[0]})</b>`);
  if(!avvisi.length) return "";
  return `<div class="alert warn" style="margin-top:10px"><div class="txt">
    <b>⚠️ Rischio concentrazione:</b> ${avvisi.join(" e ")}. Il motore massimizza la resa attesa e non guarda le squadre:
    su una singola giornata storta di quel club perdi tutto il reparto insieme, e la stessa resa la ottieni distribuendo.
    Se un'alternativa di un altro club costa uguale a parità di fantamedia attesa, <b>preferiscila</b>.</div></div>`;
}

/* ================= piano B: alternative equivalenti =================
   Se un obiettivo salta, servono subito i sostituti: stesso ruolo, rendimento simile,
   prezzo uguale o inferiore, ancora liberi. */
function alternatives(p, k){
  const a = advice(kbFor(p)); if(a.exp==null) return [];
  const base = suggPrice(p);
  /* Un'alternativa serve solo se GIOCA: niente riserve con fantamedia gonfiata dalla
     stagione passata in un'altra squadra (es. un vice-portiere ex titolare altrove). */
  return state.players.filter(x=>x.status==="free" && x.role===p.role && x.id!==p.id)
    .map(x=>{ const ad = advice(kbFor(x)); return { x, e:ad.exp||0, aff:ad.aff||0, c:Math.max(1,suggPrice(x)) }; })
    .filter(o=>o.e >= a.exp - 0.45 && o.c <= base && o.aff >= 65)
    .sort((m,n)=>(n.e-n.c/100) - (m.e-m.c/100))
    .slice(0, k||3);
}
function altHtml(p){
  const alts = alternatives(p, 3);
  if(!alts.length) return "";
  return `<div class="hint" style="width:100%;margin-top:6px">
    <b>Piano B</b> se lo perdi: ${alts.map(o=>`<span class="kchip good" style="cursor:pointer" data-sel="${o.x.id}">${esc(o.x.name)} · FM ${fmt1(o.e)} · ~${o.c}</span>`).join(" ")}
  </div>`;
}

/* ================= forza squadre: stelle 1-5 per reparto ================= */
/* ================= QUANTO RENDE DAVVERO UN REPARTO =================
   Domanda giusta: "quanto è forte il mio attacco?". Risposta sbagliata n.1: la fantamedia
   dei tre migliori — ignora che uno dei tre magari gioca sei domeniche su dieci.
   Risposta sbagliata n.2 (la mia): scontare ognuno verso la media di ruolo — ignora che
   quando il titolare manca in campo va IL TUO PRIMO CAMBIO, non un giocatore qualunque.

   Risposta giusta: per ogni combinazione di presenti/assenti si prendono i migliori
   disponibili e si pesa per la sua probabilità. Con 8 giocatori sono 256 combinazioni:
   si enumerano tutte, quindi è esatto e non stimato. Così una panchina profonda vale
   quello che vale davvero, e due giocatori che coprono lo stesso posto non si annullano.

   Limite dichiarato: le disponibilità sono trattate come indipendenti. Per due giocatori
   della stessa squadra che si alternano (Krstovic/Scamacca) la copertura reale è persino
   migliore di così, perché quando uno non gioca l'altro gioca quasi sempre. */
function resaReparto(players, role, need){
  const lista = players.filter(p=>p.role===role)
    .map(p=>{ const a=advice(kbFor(p)); if(a.exp==null) return null;
              return { e:a.exp, q:Math.max(0.02, Math.min(0.99,(a.aff||0)/100)) }; })
    .filter(Boolean).sort((a,b)=>b.e-a.e).slice(0, 12);
  if(!lista.length || !need) return null;
  const n = lista.length, base = ROLE_MEAN[role];
  let atteso = 0;
  for(let mask=0; mask<(1<<n); mask++){
    let prob = 1, somma = 0, presi = 0;
    for(let i=0;i<n;i++){
      const dentro = (mask>>i)&1;
      prob *= dentro ? lista[i].q : (1-lista[i].q);
      if(prob === 0) break;
      if(dentro && presi < need){ somma += lista[i].e; presi++; }
    }
    if(prob === 0) continue;
    somma += (need-presi) * base;      // slot che nessuno copre: vale la media di ruolo
    atteso += prob * somma;
  }
  return { tot:atteso, media:atteso/need };
}
function deptStars(players){
  /* Le stelle sono lo scarto medio dalla media del ruolo, calcolato sulla RESA del reparto:
     quanto sono forti i titolari e quanto tiene la panchina quando mancano. */
  const scarto=(coppie)=>{                       // [[ruolo, slot], ...] pesati sugli slot
    let somma=0, slot=0;
    for(const [role,n] of coppie){
      const r=resaReparto(players, role, n);
      if(!r) continue;
      somma += (r.media - ROLE_MEAN[role]) * n; slot += n;
    }
    return slot ? somma/slot : null;
  };
  const star=d=> d==null?0 : d>=0.75?5 : d>=0.38?4 : d>=0.02?3 : d>=-0.35?2 : 1;
  return { dif:star(scarto([["P",1],["D",3]])), cen:star(scarto([["C",4]])), att:star(scarto([["A",3]])) };
}
const starStr=n=> n ? `<span style="color:var(--gold);letter-spacing:1px">${"★".repeat(n)}<span style="color:var(--border)">${"☆".repeat(5-n)}</span></span>` : '<span class="team">—</span>';
/* Fantamedia attesa dell'UNDICI TITOLARE, non della rosa intera: è il numero che
   confronta davvero due squadre, perché in campo ne vanno 11 e non 25. Ogni giocatore
   è scontato per l'affidabilità (chi non gioca vale la media del suo ruolo). */
function xiFM(players, modName){
  const mod = MODULES[modName] || MODULES[state.lineup.module] || MODULES["3-4-3"];
  const need = { P:1, ...mod };
  let somma = 0, n = 0;
  for(const r of ROLES){
    if(players.filter(p=>p.role===r && advice(kbFor(p)).exp!=null).length < need[r]) return null;
    const res = resaReparto(players, r, need[r]);   // stesso modello delle stelle
    if(!res) return null;
    somma += res.tot; n += need[r];
  }
  return n ? { media: somma/n, tot: somma, n } : null;
}
/* Ogni allenatore usa il SUO modulo, non il tuo: valutare tutti col 4-3-3 sottostima
   chi ha costruito la rosa per un altro assetto. Qui si prova ogni modulo e si tiene
   quello che rende di più — è il massimo potenziale di quella rosa. */
function xiMigliore(players){
  let best = null;
  for(const nome of Object.keys(MODULES)){
    /* Col modificatore difesa attivo, un modulo sotto i 4 difensori NON lo fa scattare:
       le fantamedie attese lo contengono comunque (il bonus di ruolo è applicato a monte),
       quindi il confronto direbbe "gioca a 3 dietro" proponendoti di buttare il bonus.
       In una lega col modificatore quei moduli non sono opzioni vere. */
    if(ruleMod() !== "no" && (MODULES[nome].D || 0) < MOD_MIN_DIF) continue;
    const x = xiFM(players, nome);
    if(x && (!best || x.tot > best.tot)) best = { ...x, modulo: nome };
  }
  return best;
}
/* modulo forzato a mano per una squadra (chiave: id del rivale, oppure "me") */
function modDi(chiave){ return (state.rivalMod || {})[chiave] || ""; }
/* la rosa di una squadra, aperta sotto la sua riga: chi schiera e chi ha in panchina */
function rosaAvversario(t, x){
  const mod = MODULES[(x&&x.modulo)||state.lineup.module] || MODULES["3-4-3"];
  const need = { P:1, ...mod };
  const blocchi = ROLES.map(r=>{
    const lista = t.players.filter(p=>p.role===r).map(p=>{
      const a=advice(kbFor(p)); const q=Math.max(0,Math.min(1,(a.aff||0)/100));
      return { p, a, resa: a.exp==null?0 : q*a.exp+(1-q)*ROLE_MEAN[r] };
    }).sort((u,v)=>v.resa-u.resa);
    if(!lista.length) return "";
    return `<div style="margin-bottom:8px"><b style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em">${ROLE_NAMES[r]}</b>
      <div class="chipset" style="margin-top:4px">${lista.map((z,i)=>{

    ${blocchi}</div>`;
}

/* ================= spunti di scambio con i rivali ================= */
const DEPT={dif:["P","D"], cen:["C"], att:["A"]};
const DEPT_LABEL={dif:"difesa", cen:"centrocampo", att:"attacco"};
function deptPlayers(players, dep){
  return players.filter(p=>DEPT[dep].includes(p.role)).map(p=>({p,e:advice(kbFor(p)).exp||0})).sort((a,b)=>b.e-a.e);
}
/* Scambi che RISPETTANO i ruoli: pacchetto 2-per-2 complementare.
   Cedo (il mio forte del reparto surplus + un mio scarso del reparto need)
   e ricevo (il loro forte del reparto need + un loro riempitivo del reparto surplus):
   i conteggi per ruolo restano identici e il valore si compensa. */
const DEPT_ROLE={dif:"D", cen:"C", att:"A"};
function tradeIdeas(){
  const my=mine();
  const rivals=state.managers.map(m=>({m, players:state.players.filter(p=>p.status==="gone"&&p.owner===m.id)})).filter(r=>r.players.length>=8);
  if(my.length<8 || !rivals.length) return [];
  const ms=deptStars(my);
  const deps=["dif","cen","att"];
  const need=deps.slice().sort((a,b)=>ms[a]-ms[b])[0];
  const surplus=deps.slice().sort((a,b)=>ms[b]-ms[a])[0];
  if(need===surplus || ms[surplus]-ms[need]<1) return [];
  const needRole=DEPT_ROLE[need], surRole=DEPT_ROLE[surplus];
  const val=x=> x.e>0 ? x.e : (ROLE_MEAN[x.p.role]-0.3);      // stima per i giocatori senza FM (riempitivi)
  const byRole=(players,role)=>players.map(p=>({p,e:advice(kbFor(p)).exp||0})).filter(x=>x.p.role===role);
  const myWeak=byRole(my,needRole).sort((a,b)=>val(a)-val(b))[0];                // il mio scarso del reparto da rinforzare
  if(!myWeak) return [];
  const ideas=[];
  for(const {m,players} of rivals){
    const rs=deptStars(players);
    if(rs[need] < ms[need]+1) continue;                                            // loro nettamente più forti dove mi serve
    const get=byRole(players,needRole).filter(x=>x.e>0).sort((a,b)=>b.e-a.e)[0];    // il loro forte che voglio
    if(!get) continue;
    // offro l'attaccante/pezzo forte del mio reparto in eccesso di VALORE PIÙ VICINO a chi chiedo (scambio equo, non regalo il fuoriclasse)
    const myStrong=byRole(my,surRole).filter(x=>x.e>0).sort((a,b)=>Math.abs(val(a)-val(get))-Math.abs(val(b)-val(get)))[0];
    const getFiller=byRole(players,surRole).sort((a,b)=>val(a)-val(b))[0];          // un loro riempitivo per coprire il ruolo ceduto
    if(!myStrong||!getFiller) continue;
    if(Math.abs(val(myStrong)-val(get))>0.85) continue;                            // i due pezzi forti devono valere circa uguale
    const giveTot=val(myStrong)+val(myWeak), getTot=val(get)+val(getFiller);
    if(Math.abs(giveTot-getTot)>1.3) continue;                                      // pacchetto ~equo per il rivale
    ideas.push({m, need, surplus, myStrong, myWeak, get, getFiller, rNeed:rs[need], score: rs[need]+(5-rs[surplus])});
  }
  return ideas.sort((a,b)=>b.score-a.score).slice(0,3);
}
function tradeIdeasHtml(){
  const ideas=tradeIdeas();
  if(!mine().length || !state.managers.length) return "";
  const nm=x=>`<b>${esc(x.p.name)}</b> <span class="team">(${x.p.role}${x.e>0?", FM "+fmt1(x.e):""})</span>`;
  const body = ideas.length ? ideas.map(x=>`<div class="alert">
      <span class="role ${x.get.p.role}">${x.get.p.role}</span>
      <div class="txt">Con <b>${esc(x.m.name)}</b>: tu sei forte in <b>${DEPT_LABEL[x.surplus]}</b> e scoperto in <b>${DEPT_LABEL[x.need]}</b>, loro il contrario (${DEPT_LABEL[x.need]} ${starStr(x.rNeed)}).<br>
        <b>Offri:</b> ${nm(x.myStrong)} + ${nm(x.myWeak)} &nbsp;⇄&nbsp; <b>Ricevi:</b> ${nm(x.get)} + ${nm(x.getFiller)}.<br>
        <span class="help">Ruoli coperti (dai 1${x.surplus===x.need?"":" "+x.myStrong.p.role}+1${x.myWeak.p.role}, ricevi 1${x.get.p.role}+1${x.getFiller.p.role}), valore compensato. Migliori in ${DEPT_LABEL[x.need]}.</span></div>
      <button class="btn sm" data-open2="${x.get.p.id}">Scheda</button>
    </div>`).join("")
    : '<div class="empty">Nessuno spunto forte ora: rosa equilibrata tra i reparti, oppure mancano le rose dei rivali (importale in Rosa).</div>';
  return `<div class="card">
    <h2>Spunti di scambio con i rivali</h2>
    <p class="sub">Pacchetti <b>2-per-2 che rispettano i ruoli</b>: cedi il tuo pezzo forte dove hai abbondanza + un tuo scarso dove ti serve, e ricevi il loro forte dove ti serve + un riempitivo per coprire il ruolo ceduto. I conteggi per reparto restano identici e il valore si compensa. Spunti da negoziare.</p>
    ${body}
  </div>`;
}

function vFormazione(){

  if(!my.length) return `<div class="card">
    <h2>Formazione</h2>
    <p class="sub">Il <b>modulo</b> puoi sceglierlo già ora: guida la Rosa ideale in Strategia e il modificatore difesa. La formazione consigliata arriva dopo l'asta.</p>
    <div class="toolbar">
      <label>Modulo <select id="modSel">${Object.keys(MODULES).map(m=>`<option value="${m}" ${state.lineup.module===m?"selected":""}>${m}${ruleMod()!=="no"&&MODULES[m].D<MOD_MIN_DIF?" ⚠️":""}</option>`).join("")}</select></label>
      ${ruleMod()!=="no"?`<span class="help">Con il modificatore difesa servono almeno ${MOD_MIN_DIF} difensori: i moduli con ⚠️ lo annullano.</span>`:""}
    </div>
    ${ruleMod()!=="no" && !modDifAttivo() ? `<div class="alert crit"><div class="txt"><b>Con il ${state.lineup.module} non prendi il modificatore.</b> Ti serve una difesa da almeno ${MOD_MIN_DIF}: scegli ${moduliConModificatore().slice(0,3).join(" / ")}.</div></div>` : ""}

  </div>`;
  const mod = MODULES[state.lineup.module] || MODULES["3-4-3"];
  const need = {P:1, ...mod};
  const myTeams = [...new Set(my.map(p=>p.team))].sort();
  /* La difficoltà ora la dà il CALENDARIO, non un numero messo a mano: si legge chi
     incontra quella squadra alla giornata scelta e si guarda il rating che conta per
     il ruolo (un attaccante teme la difesa avversaria, un difensore l'attacco).
     Se l'utente ha comunque forzato un valore a mano, quello vince. */
  const g = state.giornata || 1;
  const diffDi = p=>{
    const man = state.teamsDiff[p.team];
    if(man != null) return { val: man, manuale: true };
    const d = difficoltaTurno(p.role, p.team, g);
    return d ? { val: d.val, avv: d.avv, casa: d.casa } : { val: 3 };
  };
  const score = p=>{
    const av = (state.avail||{})[p.id]||"ok";
    if(av==="out") return -99;
    const k = kbFor(p), a = advice(k);
    const base = p.rating>0 ? p.rating : (a.exp || 4 + Math.min(9,p.qta/6));
    return base + (3-diffDi(p).val)*0.35 - (av==="dubbio"?1.2:0);
  };
  const sections = ROLES.map(r=>{
    const list = my.filter(p=>p.role===r).map(p=>({p, sc:score(p)})).sort((a,b)=>b.sc-a.sc);
    const rows = list.map((x,i)=>{
      const av = (state.avail||{})[x.p.id]||"ok";
      const tit = i<need[r] && x.sc>-50;
      return `
      <div class="xirow ${tit?"tit":""}">
        ${roleChip(r)}<span class="nm">${esc(x.p.name)} <span class="team">${esc(x.p.team)}${(()=>{const d=diffDi(x.p);
          return d.avv ? ` · ${d.casa?"in casa con":"a"} <b style="color:${DIFF_COLOR(d.val)}">${esc(d.avv)}</b>` : ` · avv. ${"●".repeat(Math.round(d.val))}`;})()}</span></span>
        <select data-avail="${x.p.id}" title="Disponibilità">${[["ok","✓ gioca"],["dubbio","? dubbio"],["out","✗ out"]].map(([v,l])=>`<option value="${v}" ${av===v?"selected":""}>${l}</option>`).join("")}</select>
        <span class="sc">${x.sc<=-50?"—":x.sc.toFixed(1)}</span>
        ${tit?'<span class="badge mine">TITOLARE</span>':av==="out"?'<span class="badge gone">out</span>':`<span class="badge">panchina ${i-need[r]+1}</span>`}
      </div>`;}).join("");
    return `<h3 class="sec">${ROLE_NAMES[r]} — servono ${need[r]}</h3><div class="xi">${rows||'<div class="empty">Nessuno in rosa.</div>'}</div>`;
  }).join("");
  return `
  <div class="card">
    <h2>Formazione consigliata${CAL?` — ${g}ª giornata`:""}</h2>
    <p class="sub">Punteggio = tuo voto (se inserito) oppure FM attesa del motore, corretto per la <b>difficoltà del turno presa dal calendario</b> e per la disponibilità (✓/?/✗). Segna "out" infortunati e squalificati: escono dai titolari. Verifica sempre le probabili formazioni.</p>
    <div class="toolbar">
      ${CAL?`<label>Giornata <select id="giornataSel">${Array.from({length:38},(_,i)=>i+1).map(n=>`<option value="${n}" ${g===n?"selected":""}>${n}ª</option>`).join("")}</select></label>`:""}
      <label>Modulo <select id="modSel">${Object.keys(MODULES).map(m=>`<option value="${m}" ${state.lineup.module===m?"selected":""}>${m}${ruleMod()!=="no"&&MODULES[m].D<MOD_MIN_DIF?" ⚠️":""}</option>`).join("")}</select></label>
      ${ruleMod()!=="no"?`<span class="help">Con il modificatore difesa servono almeno ${MOD_MIN_DIF} difensori: i moduli con ⚠️ lo annullano.</span>`:""}
    </div>
    ${ruleMod()!=="no" && !modDifAttivo() ? `<div class="alert crit"><div class="txt"><b>Con il ${state.lineup.module} non prendi il modificatore.</b> Ti serve una difesa da almeno ${MOD_MIN_DIF}: scegli ${moduliConModificatore().slice(0,3).join(" / ")}.</div></div>` : ""}
    ${sections}
  </div>
  ${calendarioMioHtml(my)}
  <div class="card">
    <h2>Forzare la difficoltà a mano</h2>
    <p class="sub">Il calendario la calcola da solo per la giornata scelta. Qui puoi sovrascriverla se sai qualcosa che i rating non sanno — un'assenza pesante nell'avversario, una squadra in crisi. Lascia vuoto per tornare al calcolo automatico.</p>
    <div class="toolbar">
      ${myTeams.map(t=>`<label>${esc(t)} <select data-diff="${esc(t)}"><option value="">auto</option>${[1,2,3,4,5].map(d=>`<option value="${d}" ${state.teamsDiff[t]===d?"selected":""}>${d}</option>`).join("")}</select></label>`).join("")}
    </div>
  </div>`;
}

/* ================= IL CALENDARIO DEI TUOI =================
   La domanda pratica non è "chi è più forte" ma "chi ha il turno migliore adesso, e chi
   ce l'ha nelle prossime settimane". Serve per schierare, e serve per gli scambi: un
   giocatore con cinque turni facili davanti vale più di quanto dica la sua fantamedia. */
function calendarioMioHtml(my){
  if(!CAL) return "";
  const g0 = state.giornata || 1;
  const quante = 5;
  const gg = []; for(let i=0;i<quante && g0+i<=38;i++) gg.push(g0+i);
  if(!gg.length) return "";
  const squadre = [...new Set(my.map(p=>p.team))];
  /* una riga per squadra, non per giocatore: i tuoi giocatori della stessa squadra hanno
     lo stesso calendario, e così la tabella resta leggibile */
  const righe = squadre.map(t=>{
    const suoi = my.filter(p=>p.team===t);
    const ruoli = [...new Set(suoi.map(p=>p.role))];
    /* difficoltà media pesata sui ruoli che hai davvero in quella squadra */
    const media = gg.reduce((s,g)=>{
      const vals = ruoli.map(r=>{ const d=difficoltaTurno(r,t,g); return d?d.val:3; });
      return s + vals.reduce((a,b)=>a+b,0)/vals.length;
    },0)/gg.length;
    const celle = gg.map(g=>{
      const perRuolo = ruoli.map(r=>difficoltaTurno(r,t,g)).filter(Boolean);
      if(!perRuolo.length) return `<td class="r">—</td>`;
      const val = perRuolo.reduce((s,d)=>s+d.val,0)/perRuolo.length;
      const d0 = perRuolo[0];
      return `<td class="r" style="color:${DIFF_COLOR(val)};font-weight:700" title="${esc(t)} ${d0.casa?"in casa contro":"in trasferta a"} ${esc(d0.avv)} — ${DIFF_LABEL(val)}">${d0.casa?"":"@"}${esc(d0.avv.slice(0,4))}</td>`;
    }).join("");
    return { t, media, html:`<tr>
      <td><b>${esc(t)}</b> <span class="team">${suoi.length} tuo${suoi.length>1?"i":""}</span></td>
      ${celle}
      <td class="r num" style="color:${DIFF_COLOR(media)};font-weight:700">${media.toFixed(2)}</td>
      <td class="team" style="font-size:12px">${suoi.map(p=>esc(p.name)).join(", ")}</td></tr>` };
  }).sort((a,b)=>a.media-b.media);
  const facile = righe[0], difficile = righe[righe.length-1];
  return `<div class="card">
    <h2>Il calendario dei tuoi — prossime ${gg.length} giornate</h2>
    <p class="sub">La difficoltà è calcolata sul ruolo: i tuoi attaccanti temono le difese forti, i tuoi difensori gli attacchi forti, e giocare in casa vale circa un terzo di livello. <b>Verde = turno propizio, rosso = turno duro.</b> La media in fondo ordina le squadre dal calendario più morbido al più cattivo.</p>
    <div class="twrap"><table>
      <thead><tr><th>Squadra</th>${gg.map(g=>`<th class="r">${g}ª</th>`).join("")}<th class="r">media</th><th>i tuoi</th></tr></thead>
      <tbody>${righe.map(r=>r.html).join("")}</tbody></table></div>
    ${righe.length>1?`<p class="help" style="margin-top:8px">Nelle prossime ${gg.length} giornate il calendario più morbido ce l'ha <b>${esc(facile.t)}</b> (${facile.media.toFixed(2)}), il più duro <b>${esc(difficile.t)}</b> (${difficile.media.toFixed(2)}). Se devi scegliere fra due giocatori di valore simile, guarda questa colonna prima della fantamedia.</p>`:""}
  </div>`;
}

/* ================= tab: SCAMBI ================= */
function vScambi(){
  const my = mine();
  const q = ui.tradeSearch.trim().toLowerCase();
  const others = state.players.filter(p=>p.status!=="mine" && (q? (p.name+" "+p.team).toLowerCase().includes(q) : ui.tradeGet.includes(p.id))).slice(0,15);
  const side = (title, list, key, arr)=>`
    <div><h3 class="sec">${title}</h3>
      ${key==="get"?`<input type="search" id="tradeQ" placeholder="Cerca giocatori da ricevere…" value="${esc(ui.tradeSearch)}" style="width:100%;margin-bottom:8px">`:""}
      <div class="xi">${list.map(p=>{const a=advice(kbFor(p));return `
        <label class="xirow" style="cursor:pointer">
          <input type="checkbox" data-trade="${key}:${p.id}" ${arr.includes(p.id)?"checked":""}>
          ${roleChip(p.role)}<span class="nm">${esc(p.name)} <span class="team">${esc(p.team)}</span></span>
          ${advBadge(a)}<span class="sc">FM ${fmt1(a.exp)}</span>
        </label>`;}).join("") || '<div class="empty">Nessun giocatore.</div>'}
      </div></div>`;
  let verdict = "";
  if(ui.tradeGive.length && ui.tradeGet.length){
    const G = ui.tradeGive.map(byId).filter(Boolean), R = ui.tradeGet.map(byId).filter(Boolean);
    const sum = (l,f)=>l.reduce((t,p)=>t+f(p),0);
    const ex = p=>{const a=advice(kbFor(p)); return a.exp||6;};
    const qg = sum(G,p=>p.qta), qr = sum(R,p=>p.qta);
    const eg = sum(G,ex), er = sum(R,ex);
    const de = er-eg, dq = qr-qg;
    const cls = de>0.25?"good":de<-0.25?"bad":"";
    const label = de>0.25?"Scambio favorevole (per FM attesa)":de<-0.25?"Scambio sfavorevole (per FM attesa)":"Scambio alla pari";
    verdict = `<div class="verdict ${cls}">${label} — FM attesa: cedi ${eg.toFixed(2)}, ricevi ${er.toFixed(2)} (${de>=0?"+":""}${de.toFixed(2)})</div>
    <div class="twrap" style="margin-top:10px"><table>
      <thead><tr><th></th><th class="r">Cedi (${G.length})</th><th class="r">Ricevi (${R.length})</th><th class="r">Δ</th></tr></thead>
      <tbody>
        <tr><td>FM attesa (somma)</td><td class="r num">${eg.toFixed(2)}</td><td class="r num">${er.toFixed(2)}</td><td class="r num" style="color:${de>=0?"var(--ok)":"var(--danger)"}">${de>=0?"+":""}${de.toFixed(2)}</td></tr>
        <tr><td>Quota listone</td><td class="r num">${qg}</td><td class="r num">${qr}</td><td class="r num" style="color:${dq>=0?"var(--ok)":"var(--danger)"}">${dq>=0?"+":""}${dq}</td></tr>
      </tbody></table></div>
    <p class="help" style="margin-top:8px">I numeri non vedono tutto: pesa titolarità, rigori, calendario e gli slot che liberi od occupi.</p>`;
  }
  return `
  <div class="card">
    <h2>Valuta uno scambio</h2>
    <p class="sub">Spunta chi daresti via e chi riceveresti: il motore confronta le FM attese.</p>
    <div class="grid2">
      ${side("Cedi (dalla tua rosa)", my, "give", ui.tradeGive)}
      ${side("Ricevi", others, "get", ui.tradeGet)}
    </div>
    ${verdict || '<div class="empty">Seleziona almeno un giocatore per lato.</div>'}
  </div>
  ${tradeIdeasHtml()}
  ${repairHtml()}`;
}

/* ================= tab: CONFRONTO ================= */
function vConfronto(){
  const q = ui.cmpSearch.trim().toLowerCase();
  const picks = ui.cmp.map(byId).filter(Boolean);
  let results = "";
  if(q){
    const found = state.players.filter(p=>(p.name+" "+p.team).toLowerCase().includes(q)).slice(0,8);
    results = `<div class="xi" style="margin-top:8px">${found.map(p=>{
      const inList = ui.cmp.includes(p.id);
      return `<div class="xirow">${roleChip(p.role)}<span class="nm">${esc(p.name)} <span class="team">${esc(p.team)}</span></span>
        <button class="btn sm ${inList?"":"pri"}" data-cmpadd="${p.id}" ${inList||ui.cmp.length>=4?"disabled":""}>${inList?"già inserito":"＋ confronta"}</button></div>`;
    }).join("") || '<div class="empty">Nessun giocatore trovato.</div>'}</div>`;
  }

  let tableHtml = '<div class="empty">Aggiungi almeno 2 giocatori per confrontarli.</div>';
  if(picks.length>=1){
    const data = picks.map(p=>{ const k=kbFor(p); return {p, k, a:advice(k)}; });
    const best = (vals, hiGood=true)=>{
      const nums = vals.map(v=>v==null?null:+v).filter(v=>v!=null && !isNaN(v));
      if(!nums.length) return null;
      return hiGood?Math.max(...nums):Math.min(...nums);
    };
    const row = (label, get, hiGood=true, fmtFn=(v=>v))=>{
      const raw = data.map(get);
      const b = best(raw, hiGood);
      const cells = raw.map(v=>{
        const isBest = b!=null && v!=null && +v===b && picks.length>1;
        return `<td class="r num" style="${isBest?"font-weight:800;color:var(--accent)":""}">${v==null||v===""?"—":fmtFn(v)}</td>`;
      }).join("");
      return `<tr><th style="text-align:left">${label}</th>${cells}</tr>`;
    };
    const head = `<tr><th></th>${data.map(({p})=>`<th class="r">${roleChip(p.role)} ${esc(p.name)}<br><span class="team" style="font-weight:400">${esc(p.team)}</span> <button class="star on" data-cmpdel="${p.id}" title="Rimuovi" style="cursor:pointer;font-size:13px">✕</button></th>`).join("")}</tr>`;
    tableHtml = `<div class="twrap"><table>
      <thead>${head}</thead>
      <tbody>
        <tr><th style="text-align:left">Consiglio</th>${data.map(d=>`<td>${advBadge(d.a)}</td>`).join("")}</tr>
        ${row("FM attesa 26-27", d=>d.k?+d.a.exp.toFixed(2):null, true, v=>v.toFixed(2))}
        ${row("FM 2025-26", d=>d.k?d.k.fm:null, true, v=>v.toFixed(2))}
        ${row("Presenze", d=>d.k?d.k.pres:null)}
        ${row("Gol", d=>d.k?d.k.gol:null)}
        ${row("Assist", d=>d.k?d.k.ass:null)}
        ${row("Affidabilità", d=>d.k?d.a.aff:null, true, v=>v+"/100")}
        ${row("Titolarità %", d=>d.k?d.k.tit:null)}
        <tr><th style="text-align:left">Rigorista</th>${data.map(d=>`<td>${d.k&&d.k.rig===2?'<span class="kchip hot">Rigorista</span>':d.k&&d.k.rig===1?'<span class="kchip">n.2</span>':"—"}</td>`).join("")}</tr>
        ${row("Età", d=>d.k?d.k.age:null, false, v=>v+" anni")}
        ${row("Quota", d=>d.p.qta, false)}
        <tr><th style="text-align:left">Squadra</th>${data.map(d=>`<td class="team">${esc(d.p.team)}<br>${esc((TEAMS[d.p.team]||{}).coach||"")}</td>`).join("")}</tr>
      </tbody></table></div>
      <p class="help" style="margin-top:8px">In <b style="color:var(--accent)">verde</b> il migliore per riga (dove ha senso: FM, presenze, bonus, affidabilità). Quota ed età: valore più basso evidenziato.</p>`;
  }

  const chips = picks.length?`<div class="chipset" style="margin:6px 0 4px">${picks.map(p=>`<span class="kchip good">${esc(p.name)} <span data-cmpdel="${p.id}" style="cursor:pointer">✕</span></span>`).join("")} <button class="btn sm" id="cmpClear">Svuota</button></div>`:"";

  return `<div class="card">
    <h2>Confronto testa a testa</h2>
    <p class="sub">Il dilemma classico dell'asta — "prendo questo o quello?". Aggiungi fino a 4 giocatori e vedili affiancati su tutti i numeri del motore.</p>
    <input type="search" id="cmpQ" placeholder="Cerca un giocatore da aggiungere…" value="${esc(ui.cmpSearch)}" style="width:100%">
    ${results}
    ${chips}
    <div style="margin-top:10px">${tableHtml}</div>
  </div>`;
}

/* ================= render & eventi ================= */
function render(){
  renderHeader();
  $("#tabs").innerHTML = TABS.map(([id,l])=>`<button data-tab="${id}" class="${ui.tab===id?"on":""}">${l}</button>`).join("");
  const views = {consigli:vConsigli, listone:vListone, strategia:vStrategia, asta:vAsta, rosa:vRosa, formazione:vFormazione, confronto:vConfronto, scambi:vScambi, guida:vGuida, impostazioni:vImpostazioni};
  $("#view").innerHTML = views[ui.tab]();
  if(ui.tab==="asta" && ui.astaSel){ const el=$("#buyPrice"); if(el) el.focus(); }
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tab],[data-frole],[data-ftag],[data-tagf],[data-crole],[data-preset],[data-setmod],[data-sel],[data-target],[data-release],[data-open],#ftarget,#more,#doImport,#expJson,#loadSample,#syncKB,#resetAll,#resetEverything,#buyMine,#buyGone,#buyCancel,#undo,#genSync,#applySync,[data-openteam],#genTargets,#calcSplit,#calcSplitRes,#themeBtn,#newLeagueBtn,#addLeague2,#delLeague,[data-cmpadd],[data-cmpdel],#cmpClear,#fastToggle,[data-freemov],[data-step],#csvMine,#csvAll,[data-arole],[data-astapag],#claimBtn,[data-sqstrat],#deepBench,#recalcCaps,#copyTargets");
  if(!t) return;
  if(t.dataset.astapag!==undefined){ ui.astaPag = Math.max(0, +t.dataset.astapag||0); render(); return; }
  if(t.dataset.arole!==undefined){ ui.astaRole = t.dataset.arole; ui.astaPag = 0; render(); return; }
  if(t.dataset.sqstrat!==undefined){ ui.squadStrategy = t.dataset.sqstrat || null; _moduliCache=null; render(); return; }
  if(t.id==="deepBench"){
    state.settings.deepBench = !deepBench(); _moduliCache=null; save();
    toast(state.settings.deepBench ? "Panchina profonda: il piano compra riserve vere" : "Panchina leggera: gli slot di scorta si chiudono a 1 credito");
    render(); return;
  }
  if(t.id==="claimBtn"){
    const sel=$("#claimSel"); if(!sel) return;
    const nm=(state.managers.find(m=>m.id===sel.value)||{}).name||"";
    if(claimTeam(sel.value)){ toast(`"${nm}" è ora la tua rosa`); render(); }
    return;
  }
  if(t.id==="csvMine"||t.id==="csvAll"){
    const res = exportRoseCsv(t.id==="csvAll");
    if(!res.count){
      toast(res.missing ? "Servono i codici Id: importa prima il listone ufficiale" : "Nessun acquisto registrato da esportare");
      return;
    }
    toast(`CSV scaricato: ${res.count} giocatori${res.missing?` · ${res.missing} saltati (senza Id: reimporta il listone ufficiale)`:""}`);
    return;
  }
  if(t.id==="fastToggle"){ ui.fast=!ui.fast; ui.astaSel=null; render(); return; }
  if(t.dataset.step){
    const inp=$("#buyPrice"); if(inp){ inp.value=Math.max(1,(+inp.value||0)+ +t.dataset.step); inp.focus(); }
    return;
  }
  if(t.dataset.freemov){
    const p=byId(+t.dataset.freemov); if(p){ p.status="free"; p.paid=0; p.owner=null; undoStack=undoStack.filter(u=>u.id!==p.id); save(); toast(`${p.name} rimesso all'asta`); render(); }
    return;
  }
  if(t.id==="newLeagueBtn" || t.id==="addLeague2"){
    createLeague("");                       // nome di default "Lega N", si rinomina nel campo qui sotto
    ui.tab="strategia"; render();
    const nf = $("#leagueName"); if(nf){ nf.focus(); nf.select(); }
    toast("Lega creata — scrivi qui il nome"); return;
  }
  if(t.id==="delLeague"){
    if(store.order.length<=1){ toast("Deve restare almeno una lega"); return; }
    if(!ui.confirmDel){ ui.confirmDel=true; render(); return; }
    const nm = currentLeague().name; deleteLeague(store.current); ui.confirmDel=false; toast(`Lega "${nm}" eliminata`); render(); return;
  }
  if(t.dataset.cmpadd){ const id=+t.dataset.cmpadd; if(!ui.cmp.includes(id)&&ui.cmp.length<4){ ui.cmp.push(id); ui.cmpSearch=""; render(); } return; }
  if(t.dataset.cmpdel){ ui.cmp=ui.cmp.filter(x=>x!==+t.dataset.cmpdel); render(); return; }
  if(t.id==="cmpClear"){ ui.cmp=[]; render(); return; }
  if(t.id==="themeBtn"){
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    const next = cur==="dark"?"light":"dark";
    document.documentElement.dataset.theme = next;
    try{ localStorage.setItem("fantahq_theme", next); }catch(_){}
    return;
  }
  if(t.id==="genSync"){
    const code = syncCode();
    const ta = $("#syncArea"); ta.value = code; ta.focus(); ta.select();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(code).then(()=>toast("Codice copiato: incollalo sull'altro dispositivo")).catch(()=>toast("Codice generato: copialo dal riquadro"));
    } else { try{ document.execCommand("copy"); toast("Codice copiato"); }catch(_){ toast("Codice generato: copialo dal riquadro"); } }
    return;
  }
  if(t.id==="applySync"){
    const err = loadSyncCode($("#syncArea").value);
    if(err) toast(err); else { undoStack=[]; toast("Dati sincronizzati su questo dispositivo"); render(); }
    return;
  }
  if(t.id==="copyTargets"){
    const sel = $("#copyFromSel"); if(!sel) return;
    const nome = (store.leagues[sel.value]||{}).name || "";
    const r = copyTargetsFrom(sel.value);
    if(!r) { toast("Lega di origine non leggibile"); return; }
    render();
    toast(r.stelle||r.voti
      ? `Da "${nome}": ${r.stelle} obiettivi e ${r.voti} voti copiati${r.saltati?` · ${r.saltati} già assegnati, saltati`:""}`
      : `Niente da copiare da "${nome}": qui c'è già tutto`);
    return;
  }
  if(t.id==="recalcCaps"){
    let n=0;
    for(const p of state.players){ if(p.target && p.status==="free"){ const v=tettoMax(p); if(p.maxBid!==v){ p.maxBid=v; n++; } } }
    save(); render();
    toast(n ? `Tetti aggiornati ai prezzi di adesso: ${n} obiettivi` : "I tetti erano già aggiornati");
    return;
  }
  if(t.id==="genTargets"){
    /* Obiettivi su 3 livelli, tutti col TETTO MAX precompilato (mai sovrascrivendo i tuoi):
       1) il piano comprabile: la Rosa ideale (knapsack nel budget) diventa ★
       2) il menu dei top: i migliori per FM attesa — "di questi almeno uno lo porto a casa"
       3) le occasioni: chi vale (VORP) ben più del prezzo a cui andrà via */
    const added = {piano:0, menu:0, occasioni:0};
    /* ogni ★ si porta dietro il MOTIVO per cui è stata messa (p.tgtWhy): serve a giudicare
       un obiettivo alla volta invece di prendere o lasciare la lista intera */
    const star = (p, why) => { if(!p.target){ p.target=true; p.tgtWhy=why; return true; } return false; };
    const tetto = p => { if(!p.maxBid){ p.maxBid = tettoMax(p); } };
    /* livello 0: chi il motore giudica "Da prendere" è SEMPRE ★ — se il giudizio dice
       da prendere, la stella non può mancare (prima un must costoso poteva restare fuori
       perché i posti del suo ruolo erano già occupati da giocatori più convenienti) */
    for(const p of state.players){
      if(p.status!=="free") continue;
      const k=kbFor(p); if(!k || advice(k).tier!=="must") continue;
      if(star(p,"must")) added.menu++;
      tetto(p);
    }
    const plan = optimalSquad(ui.squadStrategy || null);
    for(const r of ROLES){
      for(const x of (plan.roles[r]?.picks||[])){ if(x.p.status==="free"){ if(star(x.p,"piano")) added.piano++; tetto(x.p); } }
      const already = state.players.filter(p=>p.role===r&&p.target).length;
      const room = Math.max(0, state.settings.slots[r]+3-already);
      const cands = state.players.filter(p=>p.role===r&&p.status==="free"&&!p.target)
        .map(p=>({p,a:advice(kbFor(p))}))
        .filter(x=>["must","target","safe","bet"].includes(x.a.tier))
        .sort((x,y)=>(y.a.exp||0)-(x.a.exp||0));
      for(const x of cands.slice(0,room)){ if(star(x.p,"top")) added.menu++; tetto(x.p); }
      /* occasioni: valore reale ≥ 15% sopra il prezzo atteso (e non spiccioli).
         Tetto per ruolo (slots+5 obiettivi totali): senza, ogni click ne aggiungeva altri. */
      const totNow = state.players.filter(p=>p.role===r&&p.target).length;
      const occRoom = Math.max(0, state.settings.slots[r]+5-totNow);
      const occ = cands.slice(room).filter(x=>{ const v=vorpPrice(x.p), c=suggPrice(x.p); return v>=c*1.15 && v>=5; })
        .sort((x,y)=>(vorpPrice(y.p)-suggPrice(y.p))-(vorpPrice(x.p)-suggPrice(x.p)));
      for(const x of occ.slice(0,occRoom)){ if(star(x.p,"occasione")) added.occasioni++; tetto(x.p); }
      /* livello 4: RIGORISTI DESIGNATI A PREZZO BASSO. I rigori valgono 1-2 fasce e il
         mercato non li prezza: un rigorista sotto i 20 crediti va segnalato sempre, anche
         se il piano d'acquisto non lo aveva scelto. */
      for(const p of state.players){
        if(p.role!==r || p.status!=="free" || p.target) continue;
        const k=kbFor(p); if(!k || k.rig!==2 || k.qta>13 || k.unc>=2 || k.inj>=3 || k.tit<74) continue;
        if(star(p,"rigorista")) added.occasioni++;
        tetto(p);
      }
    }
    save(); render();
    const tot = added.piano+added.menu+added.occasioni;
    toast(tot ? `★ ${tot} obiettivi: ${added.piano} dal piano, ${added.menu} top, ${added.occasioni} occasioni — tetti max compilati`
              : "Nessun nuovo obiettivo: la lista è già completa");
    return;
  }
  if(t.dataset.open!==undefined && !t.dataset.tab){
    const id = +t.dataset.open;
    if(ui.tab==="consigli"){ jumpToPlayer(id); }
    else { ui.openId = ui.openId===id ? 0 : id; render(); }
    return;
  }
  if(t.dataset.tab){ ui.tab=t.dataset.tab; ui.confirmReset=false; ui.confirmDel=false; ui.confirmWipe=false; ui.confirmSample=false; render(); return; }
  if(t.dataset.crole!==undefined){ ui.consRole=t.dataset.crole; render(); return; }
  if(t.dataset.frole!==undefined){ ui.role = ui.role===t.dataset.frole?"":t.dataset.frole; ui.limit=200; render(); return; }
  if(t.dataset.ftag!==undefined){ ui.tag = ui.tag===t.dataset.ftag?"":t.dataset.ftag; ui.limit=200; render(); return; }
  if(t.dataset.tagf!==undefined){
    ui.tab="listone"; ui.tag=t.dataset.tagf; ui.search=""; ui.role=""; ui.team=""; ui.onlyTarget=false; ui.openId=0; ui.limit=200;
    render(); window.scrollTo({top:0}); toast(`Listone filtrato: ${t.dataset.tagf}`);
    return;
  }
  if(t.id==="ftarget"){ ui.onlyTarget=!ui.onlyTarget; render(); return; }
  if(t.id==="more"){ ui.limit+=300; render(); return; }
  if(t.dataset.preset){ const p={...PRESETS[t.dataset.preset]}; delete p.label; state.settings.split=p;
    ui.splitCalc=""; _moduliCache=null; save(); render(); return; }
  if(t.dataset.openteam!==undefined){
    ui.openTeam = ui.openTeam===t.dataset.openteam ? "" : t.dataset.openteam;
    render(); return;
  }
  if(t.id==="calcSplit" || t.id==="calcSplitRes"){
    const res = t.id==="calcSplitRes";
    const o = splitOttimale(res ? "residuo" : "piano");
    if(!o){ toast(res ? "Rosa completa: non resta niente da ripartire" : "Non ci sono abbastanza giocatori per calcolare la ripartizione"); return; }
    const prima = {...state.settings.split};
    state.settings.split = { P:o.P, D:o.D, C:o.C, A:o.A };
    const uguale = ROLES.every(r => prima[r] === o[r]);
    const cifre = `P ${o.P}% · D ${o.D}% · C ${o.C}% · A ${o.A}% (${o.crediti.P} · ${o.crediti.D} · ${o.crediti.C} · ${o.crediti.A} crediti)`;
    ui.splitCalc = res
      ? `<b>Adattata al residuo:</b> ${cifre}. Calcolata sui <b>${budgetLeft()}</b> crediti che ti restano, `
        + `<b>${ROLES.reduce((t2,r)=>t2+Math.max(0,slotsLeft(r)),0)}</b> slot ancora vuoti e `
        + `<b>${state.players.filter(p=>p.status==="free").length}</b> giocatori ancora liberi. `
        + `<i>È una correzione di rotta, non il tuo piano: cambia a ogni acquisto.</i>`
      : `<b>Piano di partenza:</b> ${cifre}. Calcolato sul listone intero (<b>${state.players.length}</b> giocatori) `
        + `col tuo budget di <b>${state.settings.budget}</b>, modulo <b>${state.lineup.module}</b>, `
        + `<b>${state.settings.nTeams||8}</b> squadre e regolamento "${RULE_LABEL[ruleMod()]}". `
        + (uguale ? "Era già la tua: nessun cambiamento. " : `Prima avevi P ${prima.P}% · D ${prima.D}% · C ${prima.C}% · A ${prima.A}%. `)
        + `<i>Non cambia mentre l'asta procede: cambia solo se cambi modulo, regolamento, budget o numero di squadre.</i>`;
    _moduliCache = null; save(); render();
    toast(res ? `Residuo: P${o.P} D${o.D} C${o.C} A${o.A}` : (uguale ? "Era già il piano ottimo" : `Piano: P${o.P} D${o.D} C${o.C} A${o.A}`));
    return;
  }
  if(t.dataset.setmod){ state.lineup.module=t.dataset.setmod; save(); toast(`Modulo ${t.dataset.setmod}: il modificatore ora conta`); render(); return; }
  if(t.dataset.target){
    const p=byId(+t.dataset.target); p.target=!p.target;
    p.tgtWhy = p.target ? "mia" : "";           // una ★ tua resta riconoscibile come tua
    /* stella messa a mano: compila il tetto max con la formula del motore (resta modificabile) */
    if(p.target && !p.maxBid){
      p.maxBid = tettoMax(p);
      toast(`★ ${p.name} — tetto max suggerito: ${p.maxBid} (modificalo pure)`);
    }
    save(); render(); return;
  }
  if(t.dataset.sel){ ui.astaSel=+t.dataset.sel; render(); return; }
  if(t.id==="buyCancel"){ ui.astaSel=null; render(); return; }
  if(t.id==="buyMine"||t.id==="buyGone"){
    const p = byId(ui.astaSel); if(!p) return;
    const price = Math.max(0, +($("#buyPrice").value||0));
    if(t.id==="buyMine"){
      if(slotsLeft(p.role)<=0){ toast(`Slot ${p.role} già pieni`); return; }
      if(!price){ toast("Inserisci il prezzo pagato"); return; }
      if(price>maxBid()){ toast(`Oltre il tuo massimo (${maxBid()})`); return; }
      p.status="mine"; p.paid=price; p.owner=null; toast(`${p.name} è tuo per ${price} crediti`);
    }else{
      const own = $("#buyOwner"); p.owner = own ? (own.value||null) : null;
      p.status="gone"; p.paid=price; toast(`${p.name} → ${managerName(p.owner)}${price?` (${price} cr)`:""}`);
    }
    p.seq = (state.seq=(state.seq||0)+1);
    undoStack.push({id:p.id, name:p.name});
    if(undoStack.length>30) undoStack.shift();
    ui.astaSel=null; save(); render(); return;
  }
  if(t.id==="undo"){
    const u = undoStack.pop(); const p = u&&byId(u.id);
    if(p){ p.status="free"; p.paid=0; p.owner=null; save(); toast(`${p.name} riportato all'asta`); }
    render(); return;
  }
  if(t.dataset.release){ const p=byId(+t.dataset.release); p.status="free"; p.paid=0; save(); toast(`${p.name} svincolato`); render(); return; }
  if(t.id==="doImport"){
    const n = importListone($("#pasteArea").value);
    if(n){ toast(`Importati ${n} giocatori`); render(); } else toast("Nessuna riga riconosciuta: controlla il formato");
    return;
  }
  if(t.id==="expJson"){
    const blob = new Blob([JSON.stringify(store,null,1)],{type:"application/json"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="fantahq-backup.json"; a.click();
    URL.revokeObjectURL(a.href); toast("Backup scaricato (tutte le leghe)"); return;
  }
  if(t.id==="syncKB"){
    const r = syncWithKB();
    const parti = [];
    if(r.added) parti.push(`${r.added} nuovi`);
    if(r.updated) parti.push(`${r.updated} aggiornati`);
    if(r.removed) parti.push(`${r.removed} rimossi`);
    if(r.kept) parti.push(`${r.kept} tenuti perché in rosa`);
    toast(parti.length ? `Allineato: ${parti.join(", ")}` : "Era già allineato all'ultimo database");
    render(); return;
  }
  if(t.id==="loadSample"){
    /* distruttivo quanto "azzera lega": rimette il listone originale ma perde rosa,
       voti, obiettivi e impostazioni → richiede conferma come gli altri due */
    if(!ui.confirmSample){ ui.confirmSample=true; ui.confirmReset=false; ui.confirmWipe=false; render(); return; }
    currentLeague().state=freshState(); state=currentLeague().state; undoStack=[];
    Object.assign(ui,{confirmSample:false,tradeGive:[],tradeGet:[],astaSel:null,openId:0,cmp:[]});
    save(); toast("Listone ricaricato da zero: rosa, voti e obiettivi di questa lega azzerati"); render(); return;
  }
  if(t.id==="resetAll"){
    if(!ui.confirmReset){ ui.confirmReset=true; ui.confirmSample=false; ui.confirmWipe=false; render(); return; }
    currentLeague().state=freshState(); state=currentLeague().state; undoStack=[]; Object.assign(ui,{confirmReset:false,tradeGive:[],tradeGet:[],astaSel:null,openId:0,cmp:[]}); save(); toast(`Lega "${currentLeague().name}" azzerata`); render(); return;
  }
  if(t.id==="resetEverything"){
    if(!ui.confirmWipe){ ui.confirmWipe=true; ui.confirmReset=false; ui.confirmSample=false; render(); return; }
    try{ localStorage.removeItem(KEY); localStorage.removeItem(OLD2); localStorage.removeItem(OLD1); }catch(_){}
    store=newStore(); state=currentLeague().state; undoStack=[];
    Object.assign(ui,{confirmWipe:false,confirmReset:false,confirmDel:false,confirmSample:false,tradeGive:[],tradeGet:[],astaSel:null,openId:0,cmp:[],
      search:"",astaSearch:"",tradeSearch:"",cmpSearch:"",role:"",team:"",tag:"",astaRole:"",consRole:"",onlyTarget:false});
    save(); toast("Tutto azzerato: sei ripartito da una sola lega vuota"); render(); return;
  }
});
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-open2]");
  if(t){ jumpToPlayer(+t.dataset.open2); }
});

document.addEventListener("input", e=>{
  const el = e.target;
  if(el.id==="q"){ ui.search=el.value; ui.limit=200; redrawKeepFocus(el); return; }
  if(el.id==="astaQ"){ ui.astaSearch=el.value; ui.astaPag=0; redrawKeepFocus(el); return; }
  if(el.id==="tradeQ"){ ui.tradeSearch=el.value; redrawKeepFocus(el); return; }
  if(el.id==="cmpQ"){ ui.cmpSearch=el.value; redrawKeepFocus(el); return; }
  if(el.dataset.rate){ byId(+el.dataset.rate).rating=Math.min(10,Math.max(0,+el.value||0)); save(); renderHeader(); return; }
  if(el.dataset.maxbid){ byId(+el.dataset.maxbid).maxBid=Math.max(0,+el.value||0); save(); return; }
  if(el.id==="leagueName"){ renameLeague(store.current, el.value); const s=$("#leagueSel"); if(s){ const o=[...s.options].find(o=>o.value===store.current); if(o) o.textContent=el.value||currentLeague().name; } return; }
  if(el.dataset.mgr){ const m=state.managers.find(x=>x.id===el.dataset.mgr); if(m){ m.name=el.value||m.name; save(); } return; }
  if(el.id==="myTeamName"){ state.settings.myTeam=el.value; save(); return; }
  if(el.dataset.note){ const p=byId(+el.dataset.note); if(p){ p.note=el.value; save(); } return; }
});

document.addEventListener("change", e=>{
  const el = e.target;
  if(el.id==="leagueSel"){ selectLeague(el.value); render(); return; }
  if(el.id==="fteam"){ ui.team=el.value; render(); return; }
  if(el.id==="ftagMore"){ ui.tag=el.value; ui.limit=200; render(); return; }
  if(el.id==="fsort"){ ui.sort=el.value; render(); return; }
  if(el.id==="setBudget"){ state.settings.budget=Math.max(50,+el.value||500); save(); render(); return; }
  if(el.dataset.slot){ state.settings.slots[el.dataset.slot]=Math.max(0,Math.min(15,+el.value||0)); save(); render(); return; }
  if(el.dataset.split){ state.settings.split[el.dataset.split]=Math.max(0,Math.min(100,+el.value||0)); save(); render(); return; }
  if(el.id==="modSel"){ state.lineup.module=el.value; save(); render(); return; }
  if(el.dataset.rivalmod!==undefined){
    state.rivalMod = state.rivalMod || {};
    if(el.value) state.rivalMod[el.dataset.rivalmod] = el.value;
    else delete state.rivalMod[el.dataset.rivalmod];    // torna al modulo migliore calcolato
    save(); render(); return;
  }
  if(el.id==="ruleMod"){ state.settings.rules=state.settings.rules||{}; state.settings.rules.modDef=el.value; save(); toast("Regolamento aggiornato: consigli ricalcolati"); render(); return; }
  if(el.id==="setTeams"){ state.settings.nTeams=Math.max(2,Math.min(20,+el.value||8)); ensureManagers(); save(); render(); return; }
  if(el.id==="astaSort"){ ui.astaSort=el.value; ui.astaPag=0; render(); return; }
  if(el.dataset.diff!==undefined){
    if(el.value==="") delete state.teamsDiff[el.dataset.diff];      // torna al calcolo dal calendario
    else state.teamsDiff[el.dataset.diff]=+el.value;
    save(); render(); return;
  }
  if(el.id==="giornataSel"){ state.giornata=Math.max(1,Math.min(38,+el.value||1)); save(); render(); return; }
  if(el.dataset.avail){ state.avail=state.avail||{}; state.avail[el.dataset.avail]=el.value; save(); render(); return; }
  if(el.id==="impCsv"){
    const f = el.files[0]; if(!f) return;
    toast("Lettura file in corso…");
    importListoneFile(f).then(n=>{
      if(n){ toast(`Importati ${n} giocatori dal file`); render(); } else toast("Nessuna riga riconosciuta nel file");
    }).catch(err=>{ toast(err.message||"Errore nella lettura del file"); });
    el.value="";
    return;
  }
  if(el.id==="impRose"){
    const f = el.files[0]; if(!f) return;
    f.text().then(txt=>{
      const res = importRoseCsv(txt);
      if(res.err){ toast(res.err); return; }
      toast(`Rose importate: ${res.teams} squadre, ${res.matched} giocatori${res.unmatched?` (${res.unmatched} Id non trovati)`:""}`);
      render();
    });
    el.value="";
    return;
  }
  if(el.dataset.trade){
    const [side,id] = el.dataset.trade.split(":");
    const arr = side==="give"?ui.tradeGive:ui.tradeGet;
    const n = +id, i = arr.indexOf(n);
    if(el.checked && i===-1) arr.push(n); else if(!el.checked && i>-1) arr.splice(i,1);
    render(); return;
  }
  if(el.id==="impJson"){
    const f = el.files[0]; if(!f) return;
    f.text().then(txt=>{
      try{
        const obj = JSON.parse(txt);
        if(obj && obj.leagues && obj.current){                 // backup dell'intero store multi-lega
          store = obj; for(const id of store.order) store.leagues[id].state = normState(store.leagues[id].state);
          if(!store.leagues[store.current]) store.current = store.order[0];
          state = currentLeague().state;
        } else if(obj && Array.isArray(obj.players) && obj.settings){   // backup di una sola lega -> nella lega corrente
          currentLeague().state = normState(obj); state = currentLeague().state;
        } else throw 0;
        undoStack=[]; Object.assign(ui,{astaSel:null,openId:0,tradeGive:[],tradeGet:[],cmp:[]}); save(); toast("Backup ripristinato"); render();
      }catch(_){ toast("File non valido: serve un backup FantaHQ"); }
    });
  }
});

function redrawKeepFocus(el){
  const id = el.id, pos = el.selectionStart;
  render();
  const n = document.getElementById(id);
  if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} }
}

try{ const th = localStorage.getItem("fantahq_theme"); if(th) document.documentElement.dataset.theme = th; }catch(_){}
load();
render();
</script>

</body>
